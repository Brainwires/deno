# cargo-audit configuration for denext's Deno fork (read by `cargo audit` from
# the repository root; CI runs it in .github/workflows/denext_tests.yml).
#
# Every ignore below is an advisory with no fixed version we can take, or one
# whose vulnerable code is not compiled into or reachable from this tree. Each
# entry says why; DENEXT.md (the cargo audit item) has the same list. Remove an
# entry as soon as a fix can be taken.

[advisories]
ignore = [
  # rsa 0.9.x: Marvin timing side channel in PKCS#1 v1.5 decryption. No fixed
  # release exists (upstream Deno carries the same crate). Accepted risk, not
  # unreachable: WebCrypto RSA-OAEP and node:crypto privateDecrypt use it.
  # Revisit when rsa 0.10 is released.
  "RUSTSEC-2023-0071",
]
