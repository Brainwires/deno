# Copyright 2018-2026 the Deno authors. MIT license.

[package]
name = "denort_desktop"
version = "2.7.4"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Provides libdenort shared library for laufey desktop apps"

[lib]
name = "denort"
path = "lib.rs"
crate-type = ["cdylib"]

[features]
default = ["v8"]
quickjs = ["deno_core/quickjs", "denort/quickjs", "v8/quickjs"]
v8 = ["deno_core/v8", "denort/v8", "v8/v8"]

[build-dependencies]
deno_runtime.workspace = true
deno_core.workspace = true
v8.workspace = true

[dependencies]
deno_core.workspace = true
deno_error.workspace = true
deno_lib.workspace = true
deno_net.workspace = true
deno_runtime.workspace = true
deno_snapshots.workspace = true
deno_terminal.workspace = true
denort = { path = "../rt", default-features = false }
# laufey's `denext/integration` branch (API 36: open-url / file delivery,
# single-instance forwarding, the `laufey-launch.json` launch file), pinned to
# a commit of the Brainwires/laufey fork. The host built from the same commit
# must be used with it (the API version check is exact).
laufey = { git = "https://github.com/Brainwires/laufey", rev = "ab924d6d8b6f8dd1597f8c554e9143e8ec5c5929" }
libsui.workspace = true

bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
log = { workspace = true, features = ["serde"] }
raw-window-handle.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true
v8.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
