[package]
name = "denort_desktop"
version = "2.7.4"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Provides libdenort shared library for laufey desktop apps"

[lib]
name = "denort"
path = "lib.rs"
crate-type = ["cdylib"]

[features]
default = ["v8"]
quickjs = ["deno_core/quickjs", "denort/quickjs", "v8/quickjs"]
v8 = ["deno_core/v8", "denort/v8", "v8/v8"]

[build-dependencies]
deno_runtime.workspace = true
deno_core.workspace = true
v8.workspace = true

[dependencies]
deno_core.workspace = true
deno_error.workspace = true
deno_lib.workspace = true
deno_net.workspace = true
deno_runtime.workspace = true
deno_snapshots.workspace = true
deno_terminal.workspace = true
denort = { path = "../rt", default-features = false }
# laufey's `denext/integration` branch (API 44: open-url / file delivery,
# single-instance forwarding, the `laufey-launch.json` launch file, native
# passkeys, the window API, drag and drop / file dialogs / rich clipboard,
# global shortcuts / launch at login / DevTools control, menu accelerators
# and context-menu close, scheduled and actionable notifications, UI-thread
# tasks, auth sessions and their cancel, non-blocking WebKitGTK scheme
# bodies, CEF Local Network Access for registered schemes, in-process
# dialogs, and the security audit's "--" end of options / packaged --runtime
# / deep-link switch filter / pinned launch keys, the first window brought
# to the front at launch on macOS; the 3.1.1 audit: each JS call's document
# origin, `bridgeOrigins`, scheme write backpressure, packaged-launch
# pinning), pinned to
# a commit of the Brainwires/laufey fork. The host built from the same commit
# must be used with it (the API version check is exact).
laufey = { git = "https://github.com/Brainwires/laufey", rev = "7bdc5e54e5a0259dbb176a271f031e435a630e65" }
libsui.workspace = true

bytes.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
log = { workspace = true, features = ["serde"] }
raw-window-handle.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true
v8.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# The URL protocol keys of the app's deep-link schemes (HKCU\Software\Classes),
# the Node-API exports added to the host executable (napi_host_exports.rs),
# and the parent process and IPC handle a forked worker checks
# (worker_launch.rs).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
