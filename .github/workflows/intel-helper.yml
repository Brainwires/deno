name: intel helper

# A GitHub-hosted Intel Mac that joins the self-hosted fleet as ONE ephemeral
# organization runner with the denext-macos-x64 label, takes one queued job
# from that pool, and exits. Its JIT config (minted on the mini, one-time use)
# is in the INTEL_HELPER_JIT_<slot> secret. Lives on an orphan branch so no
# other workflow runs on its push.

on:
  push:
    branches: [ops/intel-helper]

permissions: {}

jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2]
    runs-on: macos-15-intel
    timeout-minutes: 360
    steps:
      - name: Join the fleet as one ephemeral denext-macos-x64 runner
        env:
          JIT: ${{ matrix.slot == 1 && secrets.INTEL_HELPER_JIT_1 || secrets.INTEL_HELPER_JIT_2 }}
        run: |
          test -n "$JIT"
          mkdir -p "$RUNNER_TEMP/helper" && cd "$RUNNER_TEMP/helper"
          v=2.338.2
          curl -fsSL -o r.tgz "https://github.com/actions/runner/releases/download/v$v/actions-runner-osx-x64-$v.tar.gz"
          tar xzf r.tgz
          sysctl -n hw.ncpu machdep.cpu.brand_string; df -h / | tail -1
          ./run.sh --jitconfig "$JIT"
