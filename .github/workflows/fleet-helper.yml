name: fleet helper

# GitHub-hosted machines that join the self-hosted fleet as ONE ephemeral
# organization runner each, take one queued job from that pool, and exit.
# JIT configs (one-time) are minted on the mini into FLEET_HELPER_JIT_<n>.

on:
  push:
    branches: [ops/fleet-helper]

permissions: {}

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        n: [4, 5]
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: Join the fleet as one ephemeral denext-windows-x64 runner
        shell: pwsh
        env:
          JIT: ${{ matrix.n == 4 && secrets.FLEET_HELPER_JIT_4 || secrets.FLEET_HELPER_JIT_5 }}
        run: |
          if (-not $env:JIT) { throw "no JIT config" }
          $d = Join-Path $env:RUNNER_TEMP "helper"; New-Item -ItemType Directory -Force $d | Out-Null; Set-Location $d
          $v = "2.338.2"
          Invoke-WebRequest -Uri "https://github.com/actions/runner/releases/download/v$v/actions-runner-win-x64-$v.zip" -OutFile r.zip
          Expand-Archive r.zip -DestinationPath . -Force
          ./run.cmd --jitconfig $env:JIT
