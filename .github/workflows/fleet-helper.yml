name: fleet helper

# GitHub-hosted machines that join the self-hosted fleet as ONE ephemeral
# organization runner each (labels: self-hosted + a pool label), take one
# queued job from that pool, and exit. JIT configs (one-time) are minted on the
# mini into the FLEET_HELPER_JIT_<n> secrets. Orphan branch: no other workflow
# runs on its push.

on:
  push:
    branches: [ops/fleet-helper]

permissions: {}

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        n: [1]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Join the fleet as one ephemeral denext-linux-x64 runner
        env:
          JIT: ${{ matrix.n == 1 && secrets.FLEET_HELPER_JIT_1 || matrix.n == 2 && secrets.FLEET_HELPER_JIT_2 || secrets.FLEET_HELPER_JIT_3 }}
        run: |
          test -n "$JIT"
          mkdir -p "$RUNNER_TEMP/helper" && cd "$RUNNER_TEMP/helper"
          v=2.338.2
          curl -fsSL -o r.tgz "https://github.com/actions/runner/releases/download/v$v/actions-runner-linux-x64-$v.tar.gz"
          tar xzf r.tgz
          ./run.sh --jitconfig "$JIT"
