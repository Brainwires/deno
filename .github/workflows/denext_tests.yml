# Upstream Deno's own test bar, on every OS, for denext's fork.
#
# The fork deletes upstream's generated workflows (ci.generated.yml and
# friends), so without this nothing ran the Rust tests, clippy, the format
# check, the unit tests or the spec tests over the denext patches. This runs
# them the way v2.9.7's ci.generated.yml does (the same commands, flags and
# CARGO_PROFILE_DEV_DEBUG=0 debug builds), on macOS arm64, Windows x64 and
# Linux x64:
#
# - lint:  tools/lint.js (clippy over the whole workspace with upstream's deny
#          flags, dlint, the copyright and repo-hygiene checks), plus
#          tools/format.js --check, tools/jsdoc_checker.js, cargo fmt and the
#          release manifest writer's, tag gate's, engine staleness gate's,
#          audit-ignore check's and glibc ceiling check's tests
#          (.github/denext-runtime/manifest_test.py, tag_gate_test.py,
#          engine_staleness_test.py, audit_ignores_test.py,
#          glibc_ceiling_test.py, self_binding_test.py, denort_pins_test.py,
#          linux_needed_test.py, toolchain_info_test.py, plan_matrix_test.py,
#          pick_runner_test.py, apt_install_test.py)
#          and the bare-assertion guard over the release scripts
#          (assert_guard.py and its test).
# - cargo-audit: RustSec advisories against Cargo.lock; .cargo/audit.toml
#          lists the reviewed exceptions, and audit_ignores.py fails when one
#          that holds only below a crate version (cc < 1.6) stops holding.
# - per OS (denext_tests_os.yml), each OS on its own so one slow OS does not
#   hold up the others' tests:
#   - build: target/debug/{deno,denort,test_server}, as upstream's build job.
#   - libs:  `cargo test --locked --lib` over upstream's crate list (every
#            crate the fork touches is in it) against that test_server, plus
#            the `#[ignore]`d LaunchServices scheme-registration test on the
#            throwaway macOS runner, and the op layer's own crates (deno_core,
#            serde_v8, deno_ops) in a second invocation.
#   - unit / specs: `cargo test -p unit_tests --test unit` and
#            `cargo test -p specs_tests --test specs` (2 shards) against them;
#            on Linux also `integration` (2 shards) and `unit_node`.
#   - unit_node + node_compat (2 shards) on Linux x64 and on every macOS and
#            Windows leg, so each OS's enabled node_compat entries
#            (tests/node_compat/config.jsonc) are checked in CI. The macOS
#            and Windows ones run on our pool for that platform while it has
#            a free slot and on the leg's GitHub image otherwise
#            (.github/denext-runtime/pick_runner.py, the leg's test-runner
#            job).
# - macOS x64 (macos-15-intel) and Linux arm64 (ubuntu-22.04-arm), two of the
#   other release architectures: build + libs only (macOS x64 also the node
#   suites); Windows arm64 (windows-11-arm): build + libs + unit + the node
#   suites.
#
# Scope (GitHub caps this account at 20 concurrent jobs, 5 of them macOS, and
# agents push many fix/feat/ci branches): the full matrix above runs on a push
# to development-denext and on a dispatch (`full` defaults to true); a tag
# would too, but tags do not trigger this workflow (denext_runtime.yml's tag
# build checks for a full run of the tagged commit instead).
# Every other push, and a pull request, runs Linux x64 only: lint, cargo audit
# and the ubuntu-22.04 leg (libs, unit, specs, integration, unit_node,
# node_compat). For a full run on a branch:
#   gh workflow run denext_tests.yml --ref <branch> -f full=true
# or add one OS to a Linux run with `-f full=false -f macos=true` (or
# windows=true). denext_runtime.yml's tag gate (.github/denext-runtime/tag_gate.py)
# counts only a run whose six legs (macos-15, windows-2022, ubuntu-22.04,
# macos-15-intel, ubuntu-22.04-arm, windows-11-arm) all passed, so a
# Linux-only run never vouches for a release, and refuses a commit that has
# any failed run at all.
#
# The test harness asks Deno's "hashy" service whether a test input hash
# already passed and PUTs one when it did (tests/util/lib/hash.rs). That is
# Deno's infrastructure, not ours: every job resolves its host to 127.0.0.1,
# so the harness always runs the tests and never reports back.
name: denext tests

on:
  push:
    branches:
      - 'denext/**'
      - 'ci/**'
      - 'rel/**'
      - 'development-denext'
      - 'feat/**'
      - 'fix/**'
      - 'integrate/**'
  pull_request:
    branches:
      - 'denext/**'
      - 'rel/**'
      - 'development-denext'
  workflow_dispatch:
    inputs:
      full:
        description: Run the full matrix (macOS arm64 + x64, Windows x64 + arm64, Linux x64 + arm64); false runs Linux x64 plus the OSes picked below
        type: boolean
        default: true
      macos:
        description: With full=false, also run the macos-15 leg
        type: boolean
        default: false
      windows:
        description: With full=false, also run the windows-2022 leg
        type: boolean
        default: false
      macos_runner:
        description: Where the macos-15 leg runs, pool (RUNNER_MACOS_ARM) or github (GitHub's macos-15 image)
        type: choice
        options:
          - pool
          - github
        default: pool

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes its run. Never
# cancelled: a tag's run, a run on `main`, and a dispatch (the event is part of
# the group, so a push never cancels a dispatched full run either).
concurrency:
  group: denext-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_BACKTRACE: full
  RUST_LIB_BACKTRACE: '0'
  # The Deno that runs the repo's tooling scripts (format.js, lint.js, ...).
  TOOLS_DENO_VERSION: 2.9.7

jobs:
  lint:
    name: lint / ${{ matrix.os }}
    # The macos-15 entry runs on the self-hosted arm64 runner RUNNER_MACOS_ARM names,
    # the ubuntu-22.04 one on the Ubuntu 22.04 Linux pool RUNNER_LINUX_X64_2204 names
    # (its image carries the setup action's packages); each on its GitHub image while
    # the variable is unset, and always on a fork's pull_request / pull_request_target.
    # The windows-2022 entry stays on the image (the 8 GB VM).
    runs-on: ${{ fromJSON(((startsWith(github.event_name, 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) || matrix.os == 'windows-2022') && format('"{0}"', matrix.os) || (matrix.os == 'macos-15' && (startsWith(vars.RUNNER_MACOS_ARM, '[') && vars.RUNNER_MACOS_ARM || format('"{0}"', vars.RUNNER_MACOS_ARM || 'macos-15'))) || (startsWith(vars.RUNNER_LINUX_X64_2204, '[') && vars.RUNNER_LINUX_X64_2204 || format('"{0}"', vars.RUNNER_LINUX_X64_2204 || 'ubuntu-22.04'))) }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Linux only unless the run is full (see the header); a dispatch's
        # macos / windows inputs add those OSes.
        os: ${{ fromJSON(format('[{0}{1}"ubuntu-22.04"]', (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.macos)) && '"macos-15",' || '', (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.windows)) && '"windows-2022",' || '')) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5
          submodules: false
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - uses: ./.github/denext-tests/setup
        with:
          cache-key: lint
      - name: format.js --check
        if: runner.os == 'Linux'
        run: deno run --allow-write --allow-read --allow-run --allow-net ./tools/format.js --check
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: jsdoc_checker.js
        if: runner.os == 'Linux'
        run: deno run --allow-read --allow-env --allow-sys ./tools/jsdoc_checker.js
      # The release manifest writer (denext_runtime.yml's manifest job).
      - name: manifest_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/manifest_test.py
      # The release tag gate (denext_runtime.yml's setup job).
      - name: tag_gate_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/tag_gate_test.py
      # The release matrix and its runners (denext_runtime.yml's setup job):
      # the jobs that launch the app need a GUI login session.
      - name: plan_matrix_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/plan_matrix_test.py
      # The node suites' pool-or-overflow pick (denext_tests_os.yml's
      # test-runner job).
      - name: pick_runner_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/pick_runner_test.py
      # The robust apt install every Linux job uses (apt_install.sh).
      - name: apt_install_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/apt_install_test.py
      # Every assertion in the release and test scripts names what it checked
      # (DENEXT.md item 141): no bare test / [ / grep -q statements.
      - name: assert_guard.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/assert_guard.py
      - name: assert_guard_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/assert_guard_test.py
      # The engine staleness gate (denext_runtime.yml's setup job).
      - name: engine_staleness_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/engine_staleness_test.py
      # The crash trace symbolicator and release symbol check
      # (denext_runtime.yml's publish job).
      - name: symbolicate_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/symbolicate_test.py
      # The conditional cargo audit ignores (the cargo-audit job).
      - name: audit_ignores_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/audit_ignores_test.py
      # The glibc ceiling check (denext_runtime.yml's cli job).
      - name: glibc_ceiling_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/glibc_ceiling_test.py
      # The Linux libdenort's -Bsymbolic check (denext_runtime.yml's denort job).
      - name: self_binding_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/self_binding_test.py
      # The shipped Linux files' NEEDED check (verify.sh).
      - name: linux_needed_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/linux_needed_test.py
      # The prebuilt-V8 fetch (the setup action and denext_runtime.yml).
      - name: fetch_rusty_v8_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/fetch_rusty_v8_test.py
      # The denort SHA-256 checks (denext_runtime.yml's cli and publish jobs).
      - name: denort_pins_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/denort_pins_test.py
      # The toolchain record in BUILD_INFO.json (denext_runtime.yml's build
      # jobs).
      - name: toolchain_info_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/toolchain_info_test.py
      - name: lint.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: deno run --allow-write --allow-read --allow-run --allow-net --allow-env ./tools/lint.js

  # RustSec advisories against Cargo.lock. Fails on any vulnerability that is
  # not listed, with its reasoning, in .cargo/audit.toml (warnings for
  # unmaintained, unsound or yanked crates are printed but do not fail).
  cargo-audit:
    name: cargo audit
    # The self-hosted Linux runner RUNNER_LINUX_X64 names, else ubuntu-22.04 (always the image on a fork's pull_request / pull_request_target).
    runs-on: ${{ fromJSON((startsWith(github.event_name, 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) && '"ubuntu-22.04"' || (startsWith(vars.RUNNER_LINUX_X64, '[') && vars.RUNNER_LINUX_X64 || format('"{0}"', vars.RUNNER_LINUX_X64 || 'ubuntu-22.04'))) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      # An ignore that holds only while Cargo.lock stays below a version
      # (RUSTSEC-2026-0418: cc < 1.6) fails here once that version comes in;
      # cargo audit itself would stay green.
      - name: Conditional audit ignores still hold
        run: python3 -I .github/denext-runtime/audit_ignores.py
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: cargo audit
        run: cargo audit --file Cargo.lock

  # The two macOS legs run on the runner the repository variables
  # RUNNER_MACOS_ARM / RUNNER_MACOS_X64 name — a bare label
  # (denext-macos-arm64) or a JSON array (["self-hosted","denext-macos-arm64"])
  # — and on GitHub's macos-15 / macos-15-intel while a variable is unset.
  # The leg names (the `name:` below) are what tag_gate.py's REQUIRED_LEGS
  # match, so they stay the GitHub image names whatever runs them.
  # denext_tests_os.yml also refuses a self-hosted label on a fork's pull_request / pull_request_target.
  macos:
    name: macos-15
    if: ${{ github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.macos) }}
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # test-runner reads the pool's queued / running jobs
    with:
      os: macos-15
      # A dispatch with macos_runner=github runs the leg on GitHub's image instead of the pool.
      runs_on: ${{ (github.event_name == 'workflow_dispatch' && inputs.macos_runner == 'github') && '"macos-15"' || (startsWith(vars.RUNNER_MACOS_ARM, '[') && vars.RUNNER_MACOS_ARM || format('"{0}"', vars.RUNNER_MACOS_ARM || 'macos-15')) }}
      # unit_node + node_compat (2 shards) on the mac-arm pool, GitHub's
      # macos-15 for the overflow (pick_runner.py).
      node_suites: true
      pick_runs_on: ${{ !(github.event_name == 'workflow_dispatch' && inputs.macos_runner == 'github') && vars.RUNNER_MACOS_ARM || '' }}
      pick_slots: ${{ vars.RUNNER_MACOS_ARM_SLOTS || '2' }}

  windows:
    name: windows-2022
    if: ${{ github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.windows) }}
    # Stays on GitHub's image: a debug deno build + the suite on the 1-slot 4 vCPU / 8 GB
    # Windows VM, and the setup action writes the hosts file (the job account is no admin).
    # Its unit_node and node_compat jobs (test crates only, against this build) take the
    # win-x64 pool while its one slot is free, else windows-2022 (pick_runner.py).
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # test-runner reads the pool's queued / running jobs
    with:
      os: windows-2022
      node_suites: true
      # The Windows pools are not widened (ops/runners/allowlist.json): they
      # serve only push / dispatch runs of these refs, and a job they refuse
      # closes the pool. Any other run keeps the image.
      pick_runs_on: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'development-denext' || github.ref_name == 'development' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'rel/') || startsWith(github.ref_name, 'train/') || startsWith(github.ref_name, 'fix/') || startsWith(github.ref_name, 'feat/'))) && vars.RUNNER_WINDOWS_X64 || '' }}
      pick_slots: ${{ vars.RUNNER_WINDOWS_X64_SLOTS || '1' }}

  linux:
    name: ubuntu-22.04
    # Every job of the leg (build, libs, each test job) on the Ubuntu 22.04
    # Linux pool (RUNNER_LINUX_X64_2204, biscuits: the glibc floor of the
    # image, every package the setup action names baked in, so nothing is
    # fetched) while it has a free slot, GitHub's ubuntu-22.04 for the
    # overflow (pick_runner.py; biscuits' Linux pools share one capacity).
    # The variable unset: GitHub's image, as before.
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # build-runner and test-runner read the pool's queued / running jobs
    with:
      os: ubuntu-22.04
      pick_all: true
      pick_runs_on: ${{ vars.RUNNER_LINUX_X64_2204 }}
      pick_slots: ${{ vars.RUNNER_LINUX_X64_2204_SLOTS || '3' }}
      pick_shared_labels: denext-linux-x64 denext-linux-x64-docker

  # The other two release architectures: the debug build and the lib tests
  # (the desktop, updater and config crates included). Full runs only.
  macos-x64:
    name: macos-15-intel
    if: ${{ github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # test-runner reads the pool's queued / running jobs
    with:
      os: macos-15-intel
      runs_on: ${{ startsWith(vars.RUNNER_MACOS_X64, '[') && vars.RUNNER_MACOS_X64 || format('"{0}"', vars.RUNNER_MACOS_X64 || 'macos-15-intel') }}
      libs_only: true
      # Plus unit_node + node_compat (2 shards): the mac-x64 pool's one slot,
      # GitHub's macos-15-intel for the overflow.
      node_suites: true
      pick_runs_on: ${{ vars.RUNNER_MACOS_X64 }}
      pick_slots: ${{ vars.RUNNER_MACOS_X64_SLOTS || '1' }}

  linux-arm64:
    name: ubuntu-22.04-arm
    if: ${{ github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    uses: ./.github/workflows/denext_tests_os.yml
    with:
      os: ubuntu-22.04-arm
      libs_only: true

  # Windows arm64 ships (CLI, denort, runtime) and has its own code paths
  # (DENEXT.md items 105 and 118 fixed x64 ones): build, libs and the unit
  # suite. Full runs only; the tag gate requires it.
  windows-arm64:
    name: windows-11-arm
    if: ${{ github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # test-runner reads the pool's queued / running jobs
    with:
      os: windows-11-arm
      libs_and_unit: true
      # Plus unit_node + node_compat (2 shards): the win-arm64 pool (the
      # repository variable RUNNER_WINDOWS_ARM, two slots), GitHub's
      # windows-11-arm for the overflow and while the variable is unset.
      node_suites: true
      # The Windows pools are not widened (ops/runners/allowlist.json): they
      # serve only push / dispatch runs of these refs, and a job they refuse
      # closes the pool. Any other run keeps the image.
      pick_runs_on: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'development-denext' || github.ref_name == 'development' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'rel/') || startsWith(github.ref_name, 'train/') || startsWith(github.ref_name, 'fix/') || startsWith(github.ref_name, 'feat/'))) && vars.RUNNER_WINDOWS_ARM || '' }}
      pick_slots: ${{ vars.RUNNER_WINDOWS_ARM_SLOTS || '2' }}
