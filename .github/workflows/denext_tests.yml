# Upstream Deno's own test bar, on every OS, for denext's fork.
#
# The fork deletes upstream's generated workflows (ci.generated.yml and
# friends), so without this nothing ran the Rust tests, clippy, the format
# check, the unit tests or the spec tests over the denext patches. This runs
# them the way v2.9.7's ci.generated.yml does (the same commands, flags and
# CARGO_PROFILE_DEV_DEBUG=0 debug builds), on macOS arm64, Windows x64 and
# Linux x64:
#
# - lint:  tools/lint.js (clippy over the whole workspace with upstream's deny
#          flags, dlint, the copyright and repo-hygiene checks), plus
#          tools/format.js --check, tools/jsdoc_checker.js, cargo fmt and the
#          release manifest writer's and tag gate's tests
#          (.github/denext-runtime/manifest_test.py, tag_gate_test.py).
# - cargo-audit: RustSec advisories against Cargo.lock; .cargo/audit.toml
#          lists the reviewed exceptions.
# - per OS (denext_tests_os.yml), each OS on its own so one slow OS does not
#   hold up the others' tests:
#   - build: target/debug/{deno,denort,test_server}, as upstream's build job.
#   - libs:  `cargo test --locked --lib` over upstream's crate list (every
#            crate the fork touches is in it) against that test_server, plus
#            the `#[ignore]`d LaunchServices scheme-registration test on the
#            throwaway macOS runner, and the op layer's own crates (deno_core,
#            serde_v8, deno_ops) in a second invocation.
#   - unit / specs: `cargo test -p unit_tests --test unit` and
#            `cargo test -p specs_tests --test specs` (2 shards) against them;
#            on Linux also `integration` (2 shards) and `unit_node`.
# - macOS x64 (macos-15-intel) and Linux arm64 (ubuntu-22.04-arm), two of the
#   other release architectures: build + libs only; Windows arm64
#   (windows-11-arm): build + libs + unit.
#
# Scope (GitHub caps this account at 20 concurrent jobs, 5 of them macOS, and
# agents push many fix/feat/ci branches): the full matrix above runs on a push
# to development-denext and on a dispatch (`full` defaults to true); a tag
# would too, but tags do not trigger this workflow (denext_runtime.yml's tag
# build checks for a full run of the tagged commit instead).
# Every other push, and a pull request, runs Linux x64 only: lint, cargo audit
# and the ubuntu-22.04 leg (libs, unit, specs, integration, unit_node,
# node_compat). For a full run on a branch:
#   gh workflow run denext_tests.yml --ref <branch> -f full=true
# or add one OS to a Linux run with `-f full=false -f macos=true` (or
# windows=true). denext_runtime.yml's tag gate (.github/denext-runtime/tag_gate.py)
# counts only a run whose six legs (macos-15, windows-2022, ubuntu-22.04,
# macos-15-intel, ubuntu-22.04-arm, windows-11-arm) all passed, so a
# Linux-only run never vouches for a release, and refuses a commit that has
# any failed run at all.
#
# The test harness asks Deno's "hashy" service whether a test input hash
# already passed and PUTs one when it did (tests/util/lib/hash.rs). That is
# Deno's infrastructure, not ours: every job resolves its host to 127.0.0.1,
# so the harness always runs the tests and never reports back.
name: denext tests

on:
  push:
    branches:
      - 'denext/**'
      - 'ci/**'
      - 'rel/**'
      - 'development-denext'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - 'denext/**'
      - 'rel/**'
      - 'development-denext'
  workflow_dispatch:
    inputs:
      full:
        description: Run the full matrix (macOS arm64 + x64, Windows x64 + arm64, Linux x64 + arm64); false runs Linux x64 plus the OSes picked below
        type: boolean
        default: true
      macos:
        description: With full=false, also run the macos-15 leg
        type: boolean
        default: false
      windows:
        description: With full=false, also run the windows-2022 leg
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes its run. Never
# cancelled: a tag's run, a run on `main`, and a dispatch (the event is part of
# the group, so a push never cancels a dispatched full run either).
concurrency:
  group: denext-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_BACKTRACE: full
  RUST_LIB_BACKTRACE: '0'
  # The Deno that runs the repo's tooling scripts (format.js, lint.js, ...).
  TOOLS_DENO_VERSION: 2.9.7

jobs:
  lint:
    name: lint / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Linux only unless the run is full (see the header); a dispatch's
        # macos / windows inputs add those OSes.
        os: ${{ fromJSON(format('[{0}{1}"ubuntu-22.04"]', (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.macos)) && '"macos-15",' || '', (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.windows)) && '"windows-2022",' || '')) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5
          submodules: false
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - uses: ./.github/denext-tests/setup
        with:
          cache-key: lint
      - name: format.js --check
        if: runner.os == 'Linux'
        run: deno run --allow-write --allow-read --allow-run --allow-net ./tools/format.js --check
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: jsdoc_checker.js
        if: runner.os == 'Linux'
        run: deno run --allow-read --allow-env --allow-sys ./tools/jsdoc_checker.js
      # The release manifest writer (denext_runtime.yml's manifest job).
      - name: manifest_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/manifest_test.py
      # The release tag gate (denext_runtime.yml's setup job).
      - name: tag_gate_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/tag_gate_test.py
      - name: lint.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: deno run --allow-write --allow-read --allow-run --allow-net --allow-env ./tools/lint.js

  # RustSec advisories against Cargo.lock. Fails on any vulnerability that is
  # not listed, with its reasoning, in .cargo/audit.toml (warnings for
  # unmaintained, unsound or yanked crates are printed but do not fail).
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: cargo audit
        run: cargo audit --file Cargo.lock

  macos:
    name: macos-15
    if: ${{ github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.macos) }}
    uses: ./.github/workflows/denext_tests_os.yml
    with:
      os: macos-15

  windows:
    name: windows-2022
    if: ${{ github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.windows) }}
    uses: ./.github/workflows/denext_tests_os.yml
    with:
      os: windows-2022

  linux:
    name: ubuntu-22.04
    uses: ./.github/workflows/denext_tests_os.yml
    with:
      os: ubuntu-22.04

  # The other two release architectures: the debug build and the lib tests
  # (the desktop, updater and config crates included). Full runs only.
  macos-x64:
    name: macos-15-intel
    if: ${{ github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    uses: ./.github/workflows/denext_tests_os.yml
    with:
      os: macos-15-intel
      libs_only: true

  linux-arm64:
    name: ubuntu-22.04-arm
    if: ${{ github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    uses: ./.github/workflows/denext_tests_os.yml
    with:
      os: ubuntu-22.04-arm
      libs_only: true

  # Windows arm64 ships (CLI, denort, runtime) and has its own code paths
  # (DENEXT.md items 105 and 118 fixed x64 ones): build, libs and the unit
  # suite. Full runs only; the tag gate requires it.
  windows-arm64:
    name: windows-11-arm
    if: ${{ github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) }}
    uses: ./.github/workflows/denext_tests_os.yml
    with:
      os: windows-11-arm
      libs_and_unit: true
