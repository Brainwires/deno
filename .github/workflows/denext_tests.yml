# Upstream Deno's own test bar, on every OS, for denext's fork.
#
# The fork deletes upstream's generated workflows (ci.generated.yml and
# friends), so without this nothing ran the Rust tests, clippy, the format
# check, the unit tests or the spec tests over the denext patches. This runs
# them the way v2.9.7's ci.generated.yml does (the same commands, flags and
# CARGO_PROFILE_DEV_DEBUG=0 debug builds), on macOS arm64, Windows x64 and
# Linux x64:
#
# - lint:  tools/lint.js (clippy over the whole workspace with upstream's deny
#          flags, dlint, the copyright and repo-hygiene checks), plus
#          tools/format.js --check, tools/jsdoc_checker.js, cargo fmt and the
#          release manifest writer's, tag gate's, engine staleness gate's,
#          audit-ignore check's and glibc ceiling check's tests
#          (.github/denext-runtime/manifest_test.py, tag_gate_test.py,
#          engine_staleness_test.py, audit_ignores_test.py,
#          glibc_ceiling_test.py, self_binding_test.py, denort_pins_test.py,
#          linux_needed_test.py, toolchain_info_test.py, plan_matrix_test.py,
#          apt_install_test.py, guard_verified_test.py, setup_cache_test.py)
#          and the bare-assertion guard over the release scripts
#          (assert_guard.py and its test).
# - cargo-audit: RustSec advisories against Cargo.lock; .cargo/audit.toml
#          lists the reviewed exceptions, and audit_ignores.py fails when one
#          that holds only below a crate version (cc < 1.6) stops holding.
# - per OS (denext_tests_os.yml), each OS on its own so one slow OS does not
#   hold up the others' tests:
#   - build: target/debug/{deno,denort,test_server}, as upstream's build job.
#   - libs:  `cargo test --locked --lib` over upstream's crate list (every
#            crate the fork touches is in it) against that test_server, plus
#            the `#[ignore]`d LaunchServices scheme-registration test on the
#            throwaway macOS runner, and the op layer's own crates (deno_core,
#            serde_v8, deno_ops) in a second invocation.
#   - unit / specs: `cargo test -p unit_tests --test unit` and
#            `cargo test -p specs_tests --test specs` (2 shards) against them;
#            on Linux also `integration` (2 shards) and `unit_node`.
#   - unit_node + node_compat (2 shards) on Linux x64 and on every macOS and
#            Windows leg, so each OS's enabled node_compat entries
#            (tests/node_compat/config.jsonc) are checked in CI. The macOS
#            and Windows ones run on our pool for that platform while it has
#            a free slot and on the leg's GitHub image otherwise (the shared
#            Brainwires/.github/actions/pick-runners action, the leg's
#            test-runner job).
#
# Runners: our self-hosted pools are the first choice, never the only one.
# Each job that may run on them is listed in a picker job (`pick runners`
# here and in each leg, `pick build runners` for a leg's build) that runs the
# shared pick-runners action: the job takes our pool while it has a free slot
# and its GitHub image at once otherwise (DENEXT_POOL_HEALTH and the queued
# jobs decide; a fork's pull request always takes the image). With the ops
# switch `github_off` in DENEXT_POOL_HEALTH a job of that image family waits
# for our pool instead of overflowing. Every job of the gate can run on our
# pools, the pickers themselves on the linux-x64 pool.
# - macOS x64 (macos-15-intel) and Linux arm64 (ubuntu-22.04-arm), two of the
#   other release architectures: build + libs only (macOS x64 also the node
#   suites); Windows arm64 (windows-11-arm): build + libs + unit + the node
#   suites.
#
# Scope (GitHub caps this account at 20 concurrent jobs, 5 of them macOS, and
# agents push many fix/feat/ci branches): the full matrix above runs on a push
# to development-denext and on a dispatch (`full` defaults to true); a tag
# would too, but tags do not trigger this workflow (denext_runtime.yml's tag
# build checks for a full run of the tagged commit instead).
# Every other push, and a pull request, runs Linux x64 only: lint, cargo audit
# and the ubuntu-22.04 leg (libs, unit, specs, integration, unit_node,
# node_compat). For a full run on a branch:
#   gh workflow run denext_tests.yml --ref <branch> -f full=true
# or add one OS to a Linux run with `-f full=false -f macos=true` (or
# windows=true). denext_runtime.yml's tag gate (.github/denext-runtime/tag_gate.py)
# counts only a run whose six legs (macos-15, windows-2022, ubuntu-22.04,
# macos-15-intel, ubuntu-22.04-arm, windows-11-arm) all passed, so a
# Linux-only run never vouches for a release, and refuses a commit that has
# any failed run at all.
#
# The test harness asks Deno's "hashy" service whether a test input hash
# already passed and PUTs one when it did (tests/util/lib/hash.rs). That is
# Deno's infrastructure, not ours: every job resolves its host to 127.0.0.1,
# so the harness always runs the tests and never reports back.
name: denext tests

on:
  push:
    branches:
      - 'denext/**'
      - 'ci/**'
      - 'rel/**'
      - 'development-denext'
      - 'feat/**'
      - 'fix/**'
      - 'integrate/**'
  pull_request:
    branches:
      - 'denext/**'
      - 'rel/**'
      - 'development-denext'
  workflow_dispatch:
    inputs:
      full:
        description: Run the full matrix (macOS arm64 + x64, Windows x64 + arm64, Linux x64 + arm64); false runs Linux x64 plus the OSes picked below
        type: boolean
        default: true
      macos:
        description: With full=false, also run the macos-15 leg
        type: boolean
        default: false
      windows:
        description: With full=false, also run the windows-2022 leg
        type: boolean
        default: false
      macos_runner:
        description: Where the macos-15 leg runs, pool (RUNNER_MACOS_ARM) or github (GitHub's macos-15 image)
        type: choice
        options:
          - pool
          - github
        default: pool

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes its run. Never
# cancelled: a tag's run, a run on `main`, and a dispatch (the event is part of
# the group, so a push never cancels a dispatched full run either).
# A push to development-denext is never cancelled or replaced (DENEXT.md item
# 354): its group carries the run id, so no later push or dispatch shares it,
# and cancel-in-progress is off for it. GitHub shows a cancelled run as a red X
# on the default branch, and a release fast-forwards that branch.
concurrency:
  group: denext-tests-${{ github.ref }}-${{ github.event_name }}${{ (github.event_name == 'push' && github.ref == 'refs/heads/development-denext') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/development-denext' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_BACKTRACE: full
  RUST_LIB_BACKTRACE: '0'
  # The Deno that runs the repo's tooling scripts (format.js, lint.js, ...).
  TOOLS_DENO_VERSION: 2.9.7

jobs:
  # Where this workflow's own jobs run (guard, lint, cargo audit): our pools
  # while they have a free slot, else GitHub's images (the shared
  # pick-runners action). The OS legs pick their jobs themselves
  # (denext_tests_os.yml). Never fails the run: on any error every job takes
  # its image (each runs-on's `||`).
  runners:
    name: pick runners
    # Our Linux x64 pool (RUNNER_LINUX_X64, biscuits): no job of a run that is
    # not a fork's pull request goes to a GitHub-hosted runner, the pickers
    # included (2026-11-17, "use only our runners"). The cost: the pick waits
    # for a free slot there, and while GitHub is on it counts its own slot as
    # busy (one Linux job may overflow that would have fit). A fork's pull
    # request, or the variable unset: GitHub's ubuntu-latest, as before.
    runs-on: ${{ (startsWith(github.event_name, 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON(vars.RUNNER_LINUX_X64 || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      actions: read # the repository's queued / running jobs
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
      hosted: ${{ steps.pick.outputs.hosted }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@b22319621b56184a647fddfdcbefa300bcb6efc5 # pick-runners
        with:
          # guard first (it runs first); cargo audit starts in guard's slot
          # when guard ends (it needs guard). lint's macos-15 and windows-2022
          # entries only on a run whose matrix has them; the windows-2022 one
          # on the win-x64 pools (LLVM's libclang for the build scripts'
          # bindgen is on both hosts since 2026-11-17) only on the refs those
          # pools serve (the windows leg's pick_pool below), else the image.
          jobs: ${{ format('guard=linux-x64@ubuntu-24.04 audit=~guard lint_linux=linux-x64-2204@ubuntu-22.04{0}{1}', (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.macos)) && ' lint_macos=macos-arm64@macos-15' || '', ((github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.windows)) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'development-denext' || github.ref_name == 'development' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'rel/') || startsWith(github.ref_name, 'train/') || startsWith(github.ref_name, 'pretest/') || startsWith(github.ref_name, 'fix/') || startsWith(github.ref_name, 'feat/'))) && ' lint_windows=windows-x64@windows-2022' || '') }}
          vars: ${{ toJSON(vars) }}

  # The verified-SHA guard (.github/denext-runtime/guard_verified.py, DENEXT.md
  # item 354). After a release, development-denext is fast-forwarded to the
  # release commit, which already passed this workflow on its release branch
  # or tag. On that push, when the commit has such a green run, every other
  # job here is skipped and the run is green on this job alone (a run whose
  # jobs were all skipped would not show as a passed check). Any other push,
  # a dispatch, a pull request, or an API error: verified=false, a full run.
  guard:
    name: verified-SHA guard
    needs: runners
    if: ${{ !cancelled() }}
    # Our linux-x64 pool while it has a free slot, else ubuntu-24.04 (runners).
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}').guard || 'ubuntu-24.04' }}
    # its own wait (GUARD_WAIT, 20 minutes) and the API reads
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # reads this workflow's runs of the commit
    outputs:
      verified: ${{ steps.check.outputs.verified || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/development-denext'
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/denext-runtime/guard_verified.py
            .github/denext-runtime/tag_gate.py
          sparse-checkout-cone-mode: false
      - id: check
        if: github.event_name == 'push' && github.ref == 'refs/heads/development-denext'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
          # A run of the commit that would verify it and is still going (the
          # train's own run, minutes from its end when the branch is pushed)
          # is waited for, up to 20 minutes, before this run builds the commit
          # a second time (guard_verified.py GUARD_WAIT).
          GUARD_WAIT: '1200'
        run: |
          set -uo pipefail
          # The script exits 0 and prints verified=false on any API error;
          # if it fails anyway, the run goes ahead in full.
          if ! out=$(python3 -I .github/denext-runtime/guard_verified.py denext_tests.yml); then
            out="::warning::guard_verified.py failed: running in full"$'\n'"verified=false"
          fi
          printf '%s\n' "$out"
          if [ "$(tail -n 1 <<<"$out")" = verified=true ]; then
            echo "verified=true" >>"$GITHUB_OUTPUT"
            echo "::notice::$(head -n 1 <<<"$out")"
          else
            echo "verified=false" >>"$GITHUB_OUTPUT"
          fi

  lint:
    name: lint / ${{ matrix.os }}
    needs: [runners, guard]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.guard.outputs.verified != 'true' }}
    # The macos-15 entry on our macos-arm64 pool, the ubuntu-22.04 one on the
    # Ubuntu 22.04 Linux pool (its image carries the setup action's packages),
    # the windows-2022 one on the win-x64 pools (on the refs they serve), each
    # while it has a free slot, else its GitHub image (runners).
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}')[matrix.os == 'macos-15' && 'lint_macos' || (matrix.os == 'windows-2022' && 'lint_windows' || 'lint_linux')] || matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Linux only unless the run is full (see the header); a dispatch's
        # macos / windows inputs add those OSes.
        os: ${{ fromJSON(format('[{0}{1}"ubuntu-22.04"]', (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.macos)) && '"macos-15",' || '', (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.windows)) && '"windows-2022",' || '')) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 5
          submodules: false
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - uses: ./.github/denext-tests/setup
        with:
          cache-key: lint
      - name: format.js --check
        if: runner.os == 'Linux'
        run: deno run --allow-write --allow-read --allow-run --allow-net ./tools/format.js --check
      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: jsdoc_checker.js
        if: runner.os == 'Linux'
        run: deno run --allow-read --allow-env --allow-sys ./tools/jsdoc_checker.js
      # The release manifest writer (denext_runtime.yml's manifest job).
      - name: manifest_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/manifest_test.py
      # The release tag gate (denext_runtime.yml's setup job).
      - name: tag_gate_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/tag_gate_test.py
      # The verified-SHA guard (each push-triggered workflow's guard job).
      - name: guard_verified_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/guard_verified_test.py
      # The release matrix and its runners (denext_runtime.yml's setup job):
      # the jobs that launch the app need a GUI login session.
      - name: plan_matrix_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/plan_matrix_test.py
      # The robust apt install every Linux job uses (apt_install.sh).
      - name: apt_install_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/apt_install_test.py
      # The test jobs' Rust cache saves only from GitHub's images and bounds
      # its restore (.github/denext-tests/setup/action.yml).
      - name: setup_cache_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/setup_cache_test.py
      # Every assertion in the release and test scripts names what it checked
      # (DENEXT.md item 141): no bare test / [ / grep -q statements.
      - name: assert_guard.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/assert_guard.py
      - name: assert_guard_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/assert_guard_test.py
      # The engine staleness gate (denext_runtime.yml's setup job).
      - name: engine_staleness_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/engine_staleness_test.py
      # The crash trace symbolicator and release symbol check
      # (denext_runtime.yml's publish job).
      - name: symbolicate_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/symbolicate_test.py
      # The conditional cargo audit ignores (the cargo-audit job).
      - name: audit_ignores_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/audit_ignores_test.py
      # The glibc ceiling check (denext_runtime.yml's cli job).
      - name: glibc_ceiling_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/glibc_ceiling_test.py
      # The Linux libdenort's -Bsymbolic check (denext_runtime.yml's denort job).
      - name: self_binding_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/self_binding_test.py
      # The shipped Linux files' NEEDED check (verify.sh).
      - name: linux_needed_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/linux_needed_test.py
      # The prebuilt-V8 fetch (the setup action and denext_runtime.yml).
      - name: fetch_rusty_v8_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/fetch_rusty_v8_test.py
      # The denort SHA-256 checks (denext_runtime.yml's cli and publish jobs).
      - name: denort_pins_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/denort_pins_test.py
      # The toolchain record in BUILD_INFO.json (denext_runtime.yml's build
      # jobs).
      - name: toolchain_info_test.py
        if: runner.os == 'Linux'
        run: python3 -I .github/denext-runtime/toolchain_info_test.py
      - name: lint.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: deno run --allow-write --allow-read --allow-run --allow-net --allow-env ./tools/lint.js

  # RustSec advisories against Cargo.lock. Fails on any vulnerability that is
  # not listed, with its reasoning, in .cargo/audit.toml (warnings for
  # unmaintained, unsound or yanked crates are printed but do not fail).
  cargo-audit:
    name: cargo audit
    needs: [runners, guard]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.guard.outputs.verified != 'true' }}
    # In guard's runner once guard ends (runners: our linux-x64 pool, or
    # ubuntu-24.04 when guard overflowed), else ubuntu-22.04.
    runs-on: ${{ fromJSON(needs.runners.outputs.plan || '{}').audit || 'ubuntu-22.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      # An ignore that holds only while Cargo.lock stays below a version
      # (RUSTSEC-2026-0418: cc < 1.6) fails here once that version comes in;
      # cargo audit itself would stay green.
      - name: Conditional audit ignores still hold
        run: python3 -I .github/denext-runtime/audit_ignores.py
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: cargo audit
        run: cargo audit --file Cargo.lock

  # Each leg passes its pool (`pick_pool`, a pick-runners pool name) and the
  # leg picks every job's runner itself: that pool while it has a free slot,
  # the leg's GitHub image (`os`) otherwise, at once (denext_tests_os.yml).
  # The pool's repository variable (RUNNER_MACOS_ARM, ...) still switches it
  # on: unset, the leg runs on its image. The leg names (the `name:` below)
  # are what tag_gate.py's REQUIRED_LEGS match, so they stay the GitHub image
  # names whatever runs them. A fork's pull_request / pull_request_target
  # always takes the images.
  macos:
    name: macos-15
    needs: guard
    if: ${{ needs.guard.outputs.verified != 'true' && (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.macos)) }}
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # the leg's pickers read the repository's queued / running jobs
    with:
      os: macos-15
      # unit_node + node_compat (2 shards) too.
      node_suites: true
      # Every job of the leg (the build too) on the mac-arm pool while it has
      # a free slot, else GitHub's macos-15, instead of queueing behind the
      # release build. A dispatch with macos_runner=github runs the whole leg
      # on GitHub's image.
      pick_all: true
      pick_pool: ${{ !(github.event_name == 'workflow_dispatch' && inputs.macos_runner == 'github') && 'macos-arm64' || '' }}

  windows:
    name: windows-2022
    needs: guard
    if: ${{ needs.guard.outputs.verified != 'true' && (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full) || (github.event_name == 'workflow_dispatch' && inputs.windows)) }}
    # The build, libs, specs and node_compat take the fast host (windows-x64-fast: the MacBook's
    # VM, never brain), unit_node and unit the win-x64 pools (the MacBook's VM and brain, 4 threads
    # / 8 GB each; LLVM's libclang for bindgen on both since 2026-11-17), while they have a free
    # slot, else windows-2022 (node_compat's network tests: see denext_tests_os.yml's test-runner).
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # the leg's pickers read the repository's queued / running jobs
    with:
      os: windows-2022
      node_suites: true
      # The Windows pools are not widened (ops/runners/allowlist.json): they
      # serve only push / dispatch runs of these refs, and a job they refuse
      # closes the pool. Any other run keeps the image (no pool).
      pick_pool: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'development-denext' || github.ref_name == 'development' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'rel/') || startsWith(github.ref_name, 'train/') || startsWith(github.ref_name, 'pretest/') || startsWith(github.ref_name, 'fix/') || startsWith(github.ref_name, 'feat/'))) && 'windows-x64' || '' }}

  linux:
    name: ubuntu-22.04
    needs: guard
    if: ${{ needs.guard.outputs.verified != 'true' }}
    # Every job of the leg (build, libs, each test job) on the Ubuntu 22.04
    # Linux pool (RUNNER_LINUX_X64_2204, biscuits: the glibc floor of the
    # image, every package the setup action names baked in, so nothing is
    # fetched) while it has a free slot, GitHub's ubuntu-22.04 for the
    # overflow (the pick-runners action; biscuits' Linux pools share one
    # capacity). The variable unset: GitHub's image, as before.
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # the leg's pickers read the repository's queued / running jobs
    with:
      os: ubuntu-22.04
      pick_all: true
      pick_pool: linux-x64-2204

  # The other two release architectures: the debug build and the lib tests
  # (the desktop, updater and config crates included). Full runs only.
  macos-x64:
    name: macos-15-intel
    needs: guard
    if: ${{ needs.guard.outputs.verified != 'true' && (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full)) }}
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # the leg's pickers read the repository's queued / running jobs
    with:
      os: macos-15-intel
      libs_only: true
      # Plus unit_node + node_compat (2 shards).
      node_suites: true
      # Every job of the leg (the build too) on the mac-x64 pool while it has
      # a free slot, else GitHub's macos-15-intel, instead of queueing behind
      # the release build.
      pick_all: true
      pick_pool: macos-x64

  linux-arm64:
    name: ubuntu-22.04-arm
    needs: guard
    if: ${{ needs.guard.outputs.verified != 'true' && (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full)) }}
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # the called workflow's runner-pick jobs read the repository's jobs
    with:
      os: ubuntu-22.04-arm
      libs_only: true
      # The build and libs on the linux-arm64 pool (Docker on the mini, 6 CPUs,
      # 6 GB + 2 GB swap) while it has a free slot, else GitHub's
      # ubuntu-22.04-arm. They fit there linked with lld (the setup action;
      # GNU ld OOMed linking deno_snapshots' build script, run 43880087120).
      pick_all: true
      pick_pool: linux-arm64

  # Windows arm64 ships (CLI, denort, runtime) and has its own code paths
  # (DENEXT.md items 105 and 118 fixed x64 ones): build, libs and the unit
  # suite. Full runs only; the tag gate requires it.
  windows-arm64:
    name: windows-11-arm
    needs: guard
    if: ${{ needs.guard.outputs.verified != 'true' && (github.ref == 'refs/heads/development-denext' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.full)) }}
    uses: ./.github/workflows/denext_tests_os.yml
    permissions:
      contents: read
      actions: read # the leg's pickers read the repository's queued / running jobs
    with:
      os: windows-11-arm
      libs_and_unit: true
      # Plus unit_node + node_compat (2 shards). Every job on the win-arm64
      # pool (RUNNER_WINDOWS_ARM) while it has a free slot, else
      # windows-11-arm (see denext_tests_os.yml's test-runner).
      node_suites: true
      # The Windows pools are not widened (ops/runners/allowlist.json): they
      # serve only push / dispatch runs of these refs, and a job they refuse
      # closes the pool. Any other run keeps the image (no pool).
      pick_pool: ${{ ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'development-denext' || github.ref_name == 'development' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'rel/') || startsWith(github.ref_name, 'train/') || startsWith(github.ref_name, 'pretest/') || startsWith(github.ref_name, 'fix/') || startsWith(github.ref_name, 'feat/'))) && 'windows-arm64' || '' }}
