# Runner canary for pool linux-arm64-desktop: proves the Orange Pi 5B (bare-metal Fedora aarch64,
# the job inside the runner user's GNOME Wayland session) runs real jobs: the host, the session's
# display (a GTK 4 window on Wayland and on Xwayland), the session keyring (secret-tool), rpm, the
# network and the job's cgroup caps. Push-triggered on train/runner-canary-pi only (train/* is a
# vetted ref; no other workflow runs on train/ pushes).
name: runner canary (pi)
on:
  push:
    branches: ['train/runner-canary-pi']
permissions:
  contents: read
jobs:
  probe:
    name: canary pi
    runs-on: [self-hosted, denext-linux-arm64-desktop]
    timeout-minutes: 20
    steps:
      - name: Host
        run: |
          echo "runner: $RUNNER_NAME  user: $(id -un) ($(id -u))  groups: $(id -nG)"
          uname -a
          grep -E '^(NAME|VERSION)=' /etc/os-release
          echo "nproc: $(nproc)"; lscpu | grep -E 'Model name|^CPU\(s\)'
          free -h
          df -h "$GITHUB_WORKSPACE" /tmp
          echo "cgroup: $(cut -d: -f3 /proc/self/cgroup)"
          cg="/sys/fs/cgroup$(cut -d: -f3 /proc/self/cgroup)"
          echo "memory.max=$(cat "$cg/memory.max") swap.max=$(cat "$cg/memory.swap.max") pids.max=$(cat "$cg/pids.max") CARGO_BUILD_JOBS=${CARGO_BUILD_JOBS:-unset}"
          if sudo -n true 2>/dev/null; then echo "::error::sudo works for the job user"; exit 1; else echo "sudo: refused (expected)"; fi
      - name: Session
        run: |
          echo "XDG_SESSION_TYPE=$XDG_SESSION_TYPE WAYLAND_DISPLAY=$WAYLAND_DISPLAY DISPLAY=$DISPLAY XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell --method org.freedesktop.DBus.Peer.Ping
      - name: GTK window (Wayland and Xwayland)
        run: |
          cat >"$RUNNER_TEMP/win.py" <<'EOF'
          import os, sys
          if "--x11" in sys.argv: os.environ["GDK_BACKEND"] = "x11"
          import gi
          gi.require_version("Gtk", "4.0")
          from gi.repository import GLib, Gtk
          ok = {"v": False}
          app = Gtk.Application(application_id="dev.denext.ci.Canary")
          def activate(a):
              w = Gtk.ApplicationWindow(application=a, title="denext canary")
              def mapped(_w):
                  ok["v"] = True
                  print(f"mapped on {type(w.get_display()).__name__} {w.get_display().get_name()}", flush=True)
                  GLib.timeout_add(500, lambda: (w.close(), False)[1])
              w.connect("map", mapped); w.present()
              GLib.timeout_add_seconds(20, lambda: (a.quit(), False)[1])
          app.connect("activate", activate); app.run([sys.argv[0]])
          sys.exit(0 if ok["v"] else 1)
          EOF
          python3 "$RUNNER_TEMP/win.py"
          python3 "$RUNNER_TEMP/win.py" --x11
      - name: Keyring (libsecret)
        run: |
          printf 'canary-%s' "$GITHUB_RUN_ID" | secret-tool store --label="denext canary" denext-canary "$GITHUB_RUN_ID"
          test "$(secret-tool lookup denext-canary "$GITHUB_RUN_ID")" = "canary-$GITHUB_RUN_ID"
          secret-tool clear denext-canary "$GITHUB_RUN_ID"
          echo "secret-tool store / lookup / clear: ok"
      - name: rpm
        run: |
          rpm --version
          rpmbuild --version
      - name: Network
        run: |
          curl -s -o /dev/null -w 'api.github.com: %{http_code} in %{time_total}s\n' https://api.github.com/rate_limit
          if curl -s -o /dev/null --max-time 5 http://192.168.50.1/; then echo "::error::the lab LAN is reachable from a job"; exit 1; else echo "lab LAN: blocked (expected)"; fi
