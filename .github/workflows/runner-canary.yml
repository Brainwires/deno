# Runner canary: proves our Windows x64 pool (the MacBook VM and brain) runs
# real jobs. Two parallel jobs on the pool's label, so both hosts get one when
# free. Push-triggered on train/runner-canary only (train/* is a vetted ref; no other workflow runs on train/ pushes).
name: runner canary
on:
  push:
    branches: ['train/runner-canary']
permissions:
  contents: read
jobs:
  probe:
    name: canary ${{ matrix.n }}
    runs-on: [self-hosted, denext-windows-x64]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    steps:
      - name: Host
        shell: pwsh
        run: |
          "runner: $env:RUNNER_NAME  host: $env:COMPUTERNAME  user: $env:USERNAME"
          $c = Get-CimInstance Win32_Processor | Select-Object -First 1
          "cpu: $($c.Name)  cores: $($c.NumberOfCores)  threads: $($c.NumberOfLogicalProcessors)"
          "ram: {0:N1} GB" -f ((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB)
          "session: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId) (0 = no desktop)"
      - name: Benchmark (CPU, single thread)
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $h = [System.Security.Cryptography.SHA256]::Create(); $b = [byte[]]::new(1MB)
          for ($i = 0; $i -lt 400; $i++) { [void]$h.ComputeHash($b) }
          "sha256 400 MB: $([int]$sw.Elapsed.TotalMilliseconds) ms"
      - name: Benchmark (small-file I/O)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "io"; New-Item -ItemType Directory -Force $d | Out-Null
          $sw = [Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt 5000; $i++) { [IO.File]::WriteAllText("$d\f$i.txt", "x" * 512) }
          $w = $sw.ElapsedMilliseconds; $sw.Restart()
          $n = 0; foreach ($f in [IO.Directory]::EnumerateFiles($d)) { $n += ([IO.File]::ReadAllText($f)).Length }
          $r = $sw.ElapsedMilliseconds; $sw.Restart()
          Remove-Item -Recurse -Force $d
          "small files: write 5000 in $w ms, read in $r ms, delete in $($sw.ElapsedMilliseconds) ms"
      - name: Benchmark (big-file I/O)
        shell: pwsh
        run: |
          $f = Join-Path $env:RUNNER_TEMP "big.bin"; $b = [byte[]]::new(4MB)
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $s = [IO.File]::Create($f); for ($i = 0; $i -lt 256; $i++) { $s.Write($b, 0, $b.Length) }; $s.Flush($true); $s.Close()
          $w = $sw.ElapsedMilliseconds; $sw.Restart()
          [void][IO.File]::ReadAllBytes($f); $r = $sw.ElapsedMilliseconds; Remove-Item $f
          "1 GB: write $w ms, read $r ms"
      - name: Benchmark (process spawn)
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          for ($i = 0; $i -lt 200; $i++) { cmd.exe /c exit 0 }
          "spawn cmd.exe x200: $($sw.ElapsedMilliseconds) ms"
      - name: Benchmark (CPU, all threads)
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $jobs = 1..[Environment]::ProcessorCount | ForEach-Object { Start-ThreadJob { $h = [System.Security.Cryptography.SHA256]::Create(); $b = [byte[]]::new(1MB); for ($i = 0; $i -lt 200; $i++) { [void]$h.ComputeHash($b) } } }
          $jobs | Wait-Job | Out-Null
          "sha256 200 MB per thread x $([Environment]::ProcessorCount): $($sw.ElapsedMilliseconds) ms"
      - name: Network
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          (Invoke-WebRequest -UseBasicParsing https://api.github.com/rate_limit).StatusCode
          "api.github.com: $([int]$sw.Elapsed.TotalMilliseconds) ms"
