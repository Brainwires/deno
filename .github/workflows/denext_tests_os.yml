# One OS of .github/workflows/denext_tests.yml: the debug build, then the lib
# tests, the unit tests and the spec tests against it. See denext_tests.yml.
name: denext tests (one OS)

on:
  workflow_call:
    inputs:
      os:
        description: The runner image (macos-15, macos-15-intel, windows-2022, windows-11-arm, ubuntu-22.04, ubuntu-22.04-arm); names the leg, its artifacts and its matrix whatever runs it
        type: string
        required: true
      libs_only:
        description: Build and run the lib tests only (the extra architecture legs)
        type: boolean
        default: false
      libs_and_unit:
        description: Build, run the lib tests and the unit suite only (Windows arm64)
        type: boolean
        default: false
      node_suites:
        description: Also run unit_node and node_compat (2 shards) on this leg, which the Linux x64 leg always runs; on the pool pick_pool names while it has a free slot, else on the os image (the shared pick-runners action)
        type: boolean
        default: false
      pick_all:
        description: Pick a runner for EVERY job of the leg (build, libs and each test job), not only the node_suites ones; the pool takes them while it has free slots, the os image the overflow (the Linux x64 leg)
        type: boolean
        default: false
      pick_pool:
        description: 'The pool the picked jobs prefer, as a pick-runners pool name (macos-arm64, macos-x64, windows-x64, windows-arm64, linux-x64-2204): each picked job runs there while it has a free slot, else on the os image. The action reads the pool''s RUNNER_* variable and DENEXT_POOL_HEALTH. Empty: every job on the os image'
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_BACKTRACE: full
  RUST_LIB_BACKTRACE: '0'
  TOOLS_DENO_VERSION: 2.9.7

# Every job's runner comes from the shared picker
# (Brainwires/.github/actions/pick-runners, pinned below): our pool
# (pick_pool) while it has a free slot, else the os image at once, so our
# runners speed a leg up and never hold it back. A job the picker does not list,
# a skipped or failed picker job, and every job of a fork's pull_request (or of
# any other pull_request* event: github.event_name / github.event are the
# caller's) take the os image; the action never puts a fork's code on our
# runners. The only job pinned to our hardware is webrtc-mdns (see there).
jobs:
  # The leg's build (a pick_all leg) and, on the Linux x64 leg, webrtc-mdns:
  # picked before the build starts. Never fails the leg: on any error the
  # build takes the os image (the action's own fallback, or the `||` below).
  # The fleet watchdog's re-route finds it by its name (`<leg> / pick build
  # runners`, " / pick ... runners" with "build" for a stuck build job).
  build-runner:
    name: pick build runners
    if: ${{ (inputs.pick_all && inputs.pick_pool != '') || inputs.os == 'ubuntu-22.04' }}
    # GitHub's image: the pick must not wait in the queue it shortens.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the repository's queued / running jobs
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
      hosted: ${{ steps.pick.outputs.hosted }}
    steps:
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@15e1b9a5cae06b73b91be1482adedc5ccfb6a742 # pick-runners
        with:
          jobs: ${{ format('{0} {1}', (inputs.pick_all && inputs.pick_pool != '') && format('build={0}@{1}', inputs.pick_pool, inputs.os) || '', inputs.os == 'ubuntu-22.04' && 'mdns=linux-x64!' || '') }}
          vars: ${{ toJSON(vars) }}

  build:
    name: build debug
    needs: build-runner
    # build-runner is skipped on a leg that picks nothing: run regardless.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.build-runner.outputs.plan || '{}').build || inputs.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - uses: ./.github/denext-tests/setup
        with:
          cache-key: build
      # Upstream's `Build debug` step, verbatim.
      - name: Build debug
        run: cargo build --locked -p deno -p denort -p test_server --bin deno --bin denort --bin test_server --features=deno/panic-trace
      - name: Pack binaries
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; else ext=; fi
          for b in deno denort test_server; do cp "target/debug/$b$ext" out/; done
          tar -cf bins.tar -C out .
          ls -la out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-bins-${{ inputs.os }}
          path: bins.tar
          retention-days: 3

  # As upstream's `test libs` job: the lib tests start target/debug/test_server
  # (the file fetcher, http_util, installer and LSP registry tests), so they
  # run against the build job's binary.
  libs:
    name: test libs
    needs: [build, test-runner]
    # test-runner is skipped on a leg that picks nothing: run regardless, but
    # only after a passed build. A Windows leg keeps libs on the image: its
    # crates need bindgen's libclang, which the Windows pool hosts lack (VS's
    # Clang component; run 43372954581 on brain).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # Picked on a pick_all leg only (test-runner lists `libs` there).
    runs-on: ${{ fromJSON(needs.test-runner.outputs.plan || '{}').libs || inputs.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - uses: ./.github/denext-tests/setup
        with:
          cache-key: libs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debug-bins-${{ inputs.os }}
      - name: Unpack binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xf bins.tar -C target/debug
          rm bins.tar
          chmod +x target/debug/* || true
          ls -la target/debug
          target/debug/deno --version
      # Upstream's `Test libs` step (v2.9.7 ci.generated.yml), plus the
      # crates the fork touches that upstream's list leaves out (deno_os,
      # deno_process, deno_html_rewriter, deno_tls) and the test harness
      # itself (test_util: its process-group kill on a timeout and the flaky
      # retry's output, DENEXT.md items 316 and 319). They are in the same
      # invocation because on their own Cargo does not unify deno_v8's `v8`
      # feature in, and deno_v8 then refuses to compile.
      - name: Test libs
        id: libs
        run: cargo test --locked --lib -p deno -p denort -p node_shim -p bsdiff_helper -p deno_lib -p denort_desktop -p deno_snapshots -p deno_bundle_runtime -p deno_cache -p deno_canvas -p deno_cron -p deno_crypto -p deno_fetch -p deno_ffi -p deno_fs -p deno_http -p deno_image -p deno_io -p deno_kv -p deno_napi -p napi_sym -p deno_net -p deno_node -p deno_node_crypto -p deno_node_sqlite -p deno_sql -p deno_pty -p denort_helper -p deno_signals -p deno_telemetry -p deno_url -p deno_web -p deno_webgpu -p deno_webidl -p deno_webrtc -p deno_websocket -p deno_webstorage -p deno_cache_dir -p deno_cli_parser -p deno_config -p deno_crypto_provider -p deno_v8 -p deno_dotenv -p eszip -p deno_http_h1 -p deno_inspector_server -p deno_lockfile -p deno_maybe_sync -p napi_sys -p node_resolver -p deno_npm -p deno_npm_cache -p deno_npm_installer -p deno_npmrc -p deno_package_json -p deno_print -p deno_resolver -p deno_runtime -p deno_features -p deno_permissions -p deno_subprocess_windows -p deno_os -p deno_process -p deno_html_rewriter -p deno_tls -p test_util
      # A test that aborts (SIGABRT, a V8 fatal error) takes the whole test
      # binary down with no name and no backtrace, as the arm64 and macOS lib
      # runs of rc.3 and rc.6 did. Run the same tests again on one thread,
      # where libtest prints each test's name before running it, so the last
      # name printed is the culprit. The job has failed either way.
      - name: Name the aborting test (Test libs again, one thread)
        if: failure() && steps.libs.outcome == 'failure'
        run: cargo test --locked --lib -p deno -p denort -p node_shim -p bsdiff_helper -p deno_lib -p denort_desktop -p deno_snapshots -p deno_bundle_runtime -p deno_cache -p deno_canvas -p deno_cron -p deno_crypto -p deno_fetch -p deno_ffi -p deno_fs -p deno_http -p deno_image -p deno_io -p deno_kv -p deno_napi -p napi_sym -p deno_net -p deno_node -p deno_node_crypto -p deno_node_sqlite -p deno_sql -p deno_pty -p denort_helper -p deno_signals -p deno_telemetry -p deno_url -p deno_web -p deno_webgpu -p deno_webidl -p deno_webrtc -p deno_websocket -p deno_webstorage -p deno_cache_dir -p deno_cli_parser -p deno_config -p deno_crypto_provider -p deno_v8 -p deno_dotenv -p eszip -p deno_http_h1 -p deno_inspector_server -p deno_lockfile -p deno_maybe_sync -p napi_sys -p node_resolver -p deno_npm -p deno_npm_cache -p deno_npm_installer -p deno_npmrc -p deno_package_json -p deno_print -p deno_resolver -p deno_runtime -p deno_features -p deno_permissions -p deno_subprocess_windows -p deno_os -p deno_process -p deno_html_rewriter -p deno_tls -p test_util -- --test-threads=1
      # The op layer's own unit tests (deno_core, the op2 macro's codegen and
      # serde_v8), which upstream's list leaves out: they hold the regression
      # tests for op buffers that are shared or resizable (DENEXT.md item 70).
      # A separate invocation, as `cargo test -p deno_core` selects its own
      # default engine features. The tests run in parallel (DENEXT.md item
      # 74), except the ones that create a V8 snapshot: a snapshot-creating
      # isolate crashes V8 when any other isolate runs in the process at the
      # same time (SIGSEGV / SIGTRAP in the read-only heap), and
      # snapshot_test_lock() only keeps two of them apart. They run on their
      # own afterwards, on one thread.
      - name: Test core libs
        run: >-
          cargo test --locked --lib -p deno_core -p serde_v8 -p deno_ops --
          --skip runtime::tests::snapshot::
          --skip runtime::tests::jsrealm::es_snapshot
          --skip modules::tests::dynamic_imports_snapshot
          --skip modules::tests::import_meta_snapshot
      - name: Test core libs (snapshot-creating tests, one thread)
        run: >-
          cargo test --locked --lib -p deno_core -- --test-threads=1
          runtime::tests::snapshot::
          runtime::tests::jsrealm::es_snapshot
          modules::tests::dynamic_imports_snapshot
          modules::tests::import_meta_snapshot
      # Registers a throwaway bundle with LaunchServices and checks the scheme
      # resolves to it; `#[ignore]`d because it writes the user's LaunchServices
      # database, which is exactly what a hosted macOS runner is for.
      - name: LaunchServices scheme registration (ignored test, macOS)
        if: runner.os == 'macOS'
        # The same crate set as above (deno_v8 needs the feature set it brings
        # in, and the build is reused); the filter selects the one test.
        run: cargo test --locked --lib -p deno -p denort -p node_shim -p bsdiff_helper -p deno_lib -p denort_desktop -p deno_snapshots -p deno_bundle_runtime -p deno_cache -p deno_canvas -p deno_cron -p deno_crypto -p deno_fetch -p deno_ffi -p deno_fs -p deno_http -p deno_image -p deno_io -p deno_kv -p deno_napi -p napi_sym -p deno_net -p deno_node -p deno_node_crypto -p deno_node_sqlite -p deno_sql -p deno_pty -p denort_helper -p deno_signals -p deno_telemetry -p deno_url -p deno_web -p deno_webgpu -p deno_webidl -p deno_webrtc -p deno_websocket -p deno_webstorage -p deno_cache_dir -p deno_cli_parser -p deno_config -p deno_crypto_provider -p deno_v8 -p deno_dotenv -p eszip -p deno_http_h1 -p deno_inspector_server -p deno_lockfile -p deno_maybe_sync -p napi_sys -p node_resolver -p deno_npm -p deno_npm_cache -p deno_npm_installer -p deno_npmrc -p deno_package_json -p deno_print -p deno_resolver -p deno_runtime -p deno_features -p deno_permissions -p deno_subprocess_windows -p deno_os -p deno_process -p deno_html_rewriter -p deno_tls -p test_util -- --ignored --exact scheme_registration::tests::macos_register_bundle_with_launch_services

  # WebRTC mDNS end to end (DENEXT.md item 370): two connections on this
  # host's LAN address, one publishing its host candidates under `.local`
  # names and the other resolving them over IPv4 multicast on port 5353. The
  # test is `#[ignore]`d because it binds 0.0.0.0:5353 and sends to the mDNS
  # group, which a developer's machine (macOS asks about local network access)
  # shouldn't do in a plain `cargo test`; this job runs it with `--ignored`.
  # The Linux x64 leg only, on our pool alone (its throwaway containers have
  # an interface with multicast): never the GitHub image, where multicast is
  # untested, and never a fork's pull request (a self-hosted runner never takes
  # untrusted code). It builds just the crate's lib tests, beside the leg.
  # Pinned to our linux-x64 pool through build-runner (`mdns=linux-x64!`), so
  # its slot counts against the build's pick on the same hosts.
  webrtc-mdns:
    name: webrtc mdns (ignored test, Linux pool)
    needs: build-runner
    if: ${{ !cancelled() && inputs.os == 'ubuntu-22.04' && !(startsWith(github.event_name, 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)) }}
    runs-on: ${{ fromJSON(needs.build-runner.outputs.plan || '{}').mdns || fromJSON('["self-hosted","denext-linux-x64"]') }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: git config --global core.symlinks true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
      - uses: ./.github/denext-tests/setup
        with:
          cache-key: webrtc-mdns
      # deno_v8 in the same invocation: on its own Cargo doesn't unify its
      # `v8` feature in (see `Test libs`).
      - name: mDNS host candidates resolve between peers
        run: >-
          cargo test --locked --lib -p deno_webrtc -p deno_v8 --
          --ignored --exact tests::mdns_host_candidates_resolve_between_peers

  # Where the leg's picked jobs run: on a node_suites leg (macOS, Windows) its
  # unit_node and node_compat jobs (and on Windows x64 unit and specs), on a
  # pick_all leg (Linux x64, macOS) libs and every test job. Our pool
  # (pick_pool) while it has a free slot, else the leg's GitHub image (the
  # shared pick-runners action), longest jobs first. After the build, so the
  # pick sees the pool as those jobs queue. It never fails the leg: on any
  # error, or with this job skipped, the jobs take the os image. The fleet
  # watchdog's re-route re-runs it (`<leg> / pick runners`) for a job stuck on
  # an unhealthy pool, and the action then overflows that pool's jobs.
  test-runner:
    name: pick runners
    needs: build
    if: ${{ !cancelled() && (inputs.node_suites || inputs.pick_all) && inputs.pick_pool != '' && needs.build.result == 'success' }}
    # GitHub's image: the pick must not wait in the queue it shortens.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # the repository's queued / running jobs
    outputs:
      plan: ${{ steps.pick.outputs.plan }}
      hosted: ${{ steps.pick.outputs.hosted }}
    steps:
      - name: The leg's picked jobs
        id: keys
        env:
          OS: ${{ inputs.os }}
          POOL: ${{ inputs.pick_pool }}
          PICK_ALL: ${{ inputs.pick_all }}
          NODE_SUITES: ${{ inputs.node_suites }}
          LIBS_ONLY: ${{ inputs.libs_only }}
          LIBS_AND_UNIT: ${{ inputs.libs_and_unit }}
        run: |
          set -euo pipefail
          # The `pick` keys of the test matrix below (and libs) this leg runs,
          # longest first (Linux x64, run 43019147950: libs 11 min,
          # integration 8-9, node_compat 8, specs 7-8, unit and unit_node 5).
          # Node's network tests (UDP broadcast, IPv6 autoselectfamily, the
          # internet/ suite) cannot pass on our Windows runners, whose job
          # firewall isolates them from the LAN by design (broadcast and
          # private ranges blocked): node_compat on a Windows leg is never
          # listed, so it runs on GitHub's image; the pool takes unit_node
          # first.
          suites=false
          if [ "$LIBS_ONLY" != true ] && [ "$LIBS_AND_UNIT" != true ]; then suites=true; fi
          keys=()
          if [ "$OS" = ubuntu-22.04 ]; then
            keys=(libs integration_0 integration_1 node_compat_0 node_compat_1 specs_0 specs_1 unit_node unit)
          elif [[ "$OS" == windows* ]]; then
            if [ "$NODE_SUITES" = true ]; then keys+=(unit_node); fi
            if [ "$suites" = true ]; then keys+=(specs_0 specs_1 unit); fi
          else
            if [ "$PICK_ALL" = true ]; then keys+=(libs); fi
            if [ "$NODE_SUITES" = true ]; then keys+=(node_compat_0 node_compat_1); fi
            if [ "$PICK_ALL" = true ] && [ "$suites" = true ]; then keys+=(specs_0 specs_1); fi
            if [ "$NODE_SUITES" = true ]; then keys+=(unit_node); fi
            if [ "$PICK_ALL" = true ] && [ "$suites" = true ]; then keys+=(unit); fi
          fi
          jobs=""
          # The long specs shards (70 min on win-x64, 80-85 on win-x64-brain, an i3)
          # ask for the fast Windows host only: windows-x64-fast is the label
          # only win-x64's runners carry; when that host is busy they take the
          # image, never brain.
          for k in ${keys[@]+"${keys[@]}"}; do
            p=$POOL
            if [ "$POOL" = windows-x64 ] && [[ "$k" == specs_* ]]; then p=windows-x64-fast; fi
            jobs="$jobs $k=$p@$OS"
          done
          echo "jobs=${jobs# }" >>"$GITHUB_OUTPUT"
          echo "jobs: ${jobs# }"
      - id: pick
        uses: Brainwires/.github/actions/pick-runners@15e1b9a5cae06b73b91be1482adedc5ccfb6a742 # pick-runners
        with:
          jobs: ${{ steps.keys.outputs.jobs }}
          vars: ${{ toJSON(vars) }}

  # unit and specs on every OS; on Linux also upstream's integration and
  # unit_node suites (the fork changes ext/os, ext/http, ext/net and
  # ext/process, which they cover) and node_compat, Node.js's own test suite
  # for every test tests/node_compat/config.jsonc enables. A node_suites leg
  # (macOS, Windows) adds unit_node and node_compat (2 shards) too, so every
  # OS's enabled node_compat entries are checked in CI, not only on a
  # workstation. An entry with `pick` runs where test-runner picked for it
  # when test-runner lists that key, else (and every entry without `pick`)
  # on the os image.
  test:
    name: test ${{ matrix.suite }}${{ matrix.shard_label }}
    needs: [build, test-runner]
    # test-runner is skipped on a leg that picks nothing: run regardless, but
    # only after a passed build.
    if: ${{ !cancelled() && needs.build.result == 'success' && (!inputs.libs_only || inputs.node_suites) }}
    runs-on: ${{ matrix.pick && fromJSON(needs.test-runner.outputs.plan || '{}')[matrix.pick] || inputs.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.os == 'ubuntu-22.04' && '[{"suite":"unit","package":"unit_tests","shard":"","shard_total":"","shard_label":"","pick":"unit"},{"suite":"specs","package":"specs_tests","shard":"0","shard_total":"2","shard_label":" (1/2)","pick":"specs_0"},{"suite":"specs","package":"specs_tests","shard":"1","shard_total":"2","shard_label":" (2/2)","pick":"specs_1"},{"suite":"integration","package":"integration_tests","shard":"0","shard_total":"2","shard_label":" (1/2)","pick":"integration_0"},{"suite":"integration","package":"integration_tests","shard":"1","shard_total":"2","shard_label":" (2/2)","pick":"integration_1"},{"suite":"unit_node","package":"unit_node_tests","shard":"","shard_total":"","shard_label":"","pick":"unit_node"},{"suite":"node_compat","package":"node_compat_tests","shard":"0","shard_total":"2","shard_label":" (1/2)","pick":"node_compat_0"},{"suite":"node_compat","package":"node_compat_tests","shard":"1","shard_total":"2","shard_label":" (2/2)","pick":"node_compat_1"}]' || format('[{0}{1}{2}]', inputs.libs_and_unit && '{"suite":"unit","package":"unit_tests","shard":"","shard_total":"","shard_label":""}' || (!inputs.libs_only && '{"suite":"unit","package":"unit_tests","shard":"","shard_total":"","shard_label":"","pick":"unit"},{"suite":"specs","package":"specs_tests","shard":"0","shard_total":"2","shard_label":" (1/2)","pick":"specs_0"},{"suite":"specs","package":"specs_tests","shard":"1","shard_total":"2","shard_label":" (2/2)","pick":"specs_1"}' || ''), ((inputs.libs_and_unit || !inputs.libs_only) && inputs.node_suites) && ',' || '', inputs.node_suites && '{"suite":"node_compat","package":"node_compat_tests","shard":"0","shard_total":"2","shard_label":" (1/2)","pick":"node_compat_0"},{"suite":"node_compat","package":"node_compat_tests","shard":"1","shard_total":"2","shard_label":" (2/2)","pick":"node_compat_1"},{"suite":"unit_node","package":"unit_node_tests","shard":"","shard_total":"","shard_label":"","pick":"unit_node"}' || '')) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - name: Clone submodule ./tests/node_compat/runner/suite
        if: matrix.suite == 'node_compat'
        run: git submodule update --init --depth=1 -- ./tests/node_compat/runner/suite
      - uses: ./.github/denext-tests/setup
        with:
          cache-key: test-${{ matrix.suite }}
          # The node suites' test crates need no bindgen: a pool image without
          # VS's Clang component runs them.
          libclang: ${{ matrix.pick && 'false' || 'true' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: debug-bins-${{ inputs.os }}
      - name: Unpack binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xf bins.tar -C target/debug
          rm bins.tar
          chmod +x target/debug/* || true
          ls -la target/debug
          target/debug/deno --version
      - name: Build ffi (debug)
        if: matrix.suite == 'specs' || matrix.suite == 'integration'
        run: cargo build -p test_ffi
      # Upstream's `Test (debug)` step.
      - name: Test (debug)
        env:
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_TOTAL: ${{ matrix.shard_total }}
        run: cargo test -p ${{ matrix.package }} --test ${{ matrix.suite }}
      - name: Ensure no git changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::cargo test modified git-tracked files"
            git status
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results-${{ inputs.os }}-${{ matrix.suite }}${{ matrix.shard_total && format('-shard-{0}', matrix.shard) || '' }}
          path: target/test_results_${{ matrix.suite }}.json
          if-no-files-found: ignore
          retention-days: 7
