# One OS of .github/workflows/denext_tests.yml: the debug build, then the lib
# tests, the unit tests and the spec tests against it. See denext_tests.yml.
name: denext tests (one OS)

on:
  workflow_call:
    inputs:
      os:
        description: The runner image (macos-14, windows-2022, ubuntu-22.04)
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  RUST_BACKTRACE: full
  RUST_LIB_BACKTRACE: '0'
  TOOLS_DENO_VERSION: 2.9.7

jobs:
  build:
    name: build debug
    runs-on: ${{ inputs.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - uses: ./.github/denext-tests/setup
        with:
          cache-key: build
      # Upstream's `Build debug` step, verbatim.
      - name: Build debug
        run: cargo build --locked -p deno -p denort -p test_server --bin deno --bin denort --bin test_server --features=deno/panic-trace
      - name: Pack binaries
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; else ext=; fi
          for b in deno denort test_server; do cp "target/debug/$b$ext" out/; done
          tar -cf bins.tar -C out .
          ls -la out
      - uses: actions/upload-artifact@v7
        with:
          name: debug-bins-${{ inputs.os }}
          path: bins.tar
          retention-days: 3

  # As upstream's `test libs` job: the lib tests start target/debug/test_server
  # (the file fetcher, http_util, installer and LSP registry tests), so they
  # run against the build job's binary.
  libs:
    name: test libs
    needs: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - uses: ./.github/denext-tests/setup
        with:
          cache-key: libs
      - uses: actions/download-artifact@v8
        with:
          name: debug-bins-${{ inputs.os }}
      - name: Unpack binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xf bins.tar -C target/debug
          rm bins.tar
          chmod +x target/debug/* || true
          ls -la target/debug
          target/debug/deno --version
      # Upstream's `Test libs` step (v2.9.7 ci.generated.yml), plus the two
      # crates the fork touches that upstream's list leaves out (deno_os,
      # deno_process). They are in the same invocation because on their own
      # Cargo does not unify deno_v8's `v8` feature in, and deno_v8 then
      # refuses to compile.
      - name: Test libs
        run: cargo test --locked --lib -p deno -p denort -p node_shim -p bsdiff_helper -p deno_lib -p denort_desktop -p deno_snapshots -p deno_bundle_runtime -p deno_cache -p deno_canvas -p deno_cron -p deno_crypto -p deno_fetch -p deno_ffi -p deno_fs -p deno_http -p deno_image -p deno_io -p deno_kv -p deno_napi -p napi_sym -p deno_net -p deno_node -p deno_node_crypto -p deno_node_sqlite -p denort_helper -p deno_signals -p deno_telemetry -p deno_url -p deno_web -p deno_webgpu -p deno_webidl -p deno_websocket -p deno_webstorage -p deno_cache_dir -p deno_cli_parser -p deno_config -p deno_crypto_provider -p deno_v8 -p deno_dotenv -p eszip -p deno_http_h1 -p deno_inspector_server -p deno_lockfile -p deno_maybe_sync -p napi_sys -p node_resolver -p deno_npm -p deno_npm_cache -p deno_npm_installer -p deno_npmrc -p deno_package_json -p deno_print -p deno_resolver -p deno_typescript_go_client_rust -p deno_runtime -p deno_features -p deno_permissions -p deno_subprocess_windows -p deno_os -p deno_process
      # Registers a throwaway bundle with LaunchServices and checks the scheme
      # resolves to it; `#[ignore]`d because it writes the user's LaunchServices
      # database, which is exactly what a hosted macOS runner is for.
      - name: LaunchServices scheme registration (ignored test, macOS)
        if: runner.os == 'macOS'
        # The same crate set as above (deno_v8 needs the feature set it brings
        # in, and the build is reused); the filter selects the one test.
        run: cargo test --locked --lib -p deno -p denort -p node_shim -p bsdiff_helper -p deno_lib -p denort_desktop -p deno_snapshots -p deno_bundle_runtime -p deno_cache -p deno_canvas -p deno_cron -p deno_crypto -p deno_fetch -p deno_ffi -p deno_fs -p deno_http -p deno_image -p deno_io -p deno_kv -p deno_napi -p napi_sym -p deno_net -p deno_node -p deno_node_crypto -p deno_node_sqlite -p denort_helper -p deno_signals -p deno_telemetry -p deno_url -p deno_web -p deno_webgpu -p deno_webidl -p deno_websocket -p deno_webstorage -p deno_cache_dir -p deno_cli_parser -p deno_config -p deno_crypto_provider -p deno_v8 -p deno_dotenv -p eszip -p deno_http_h1 -p deno_inspector_server -p deno_lockfile -p deno_maybe_sync -p napi_sys -p node_resolver -p deno_npm -p deno_npm_cache -p deno_npm_installer -p deno_npmrc -p deno_package_json -p deno_print -p deno_resolver -p deno_typescript_go_client_rust -p deno_runtime -p deno_features -p deno_permissions -p deno_subprocess_windows -p deno_os -p deno_process -- --ignored --exact scheme_registration::tests::macos_register_bundle_with_launch_services

  test:
    name: test ${{ matrix.suite }}${{ matrix.shard_label }}
    needs: build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            package: unit_tests
            shard: ''
            shard_total: ''
            shard_label: ''
          - suite: specs
            package: specs_tests
            shard: '0'
            shard_total: '2'
            shard_label: ' (1/2)'
          - suite: specs
            package: specs_tests
            shard: '1'
            shard_total: '2'
            shard_label: ' (2/2)'
    defaults:
      run:
        shell: bash
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - uses: ./.github/denext-tests/setup
        with:
          cache-key: test-${{ matrix.suite }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: debug-bins-${{ inputs.os }}
      - name: Unpack binaries
        run: |
          set -euo pipefail
          mkdir -p target/debug
          tar -xf bins.tar -C target/debug
          rm bins.tar
          chmod +x target/debug/* || true
          ls -la target/debug
          target/debug/deno --version
      - name: Build ffi (debug)
        if: matrix.suite == 'specs'
        run: cargo build -p test_ffi
      # Upstream's `Test (debug)` step.
      - name: Test (debug)
        env:
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_TOTAL: ${{ matrix.shard_total }}
        run: cargo test -p ${{ matrix.package }} --test ${{ matrix.suite }}
      - name: Ensure no git changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::cargo test modified git-tracked files"
            git status
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ inputs.os }}-${{ matrix.suite }}${{ matrix.shard_total && format('-shard-{0}', matrix.shard) || '' }}
          path: target/test_results_${{ matrix.suite }}.json
          if-no-files-found: ignore
          retention-days: 7
