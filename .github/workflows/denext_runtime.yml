# Builds denext's patched Deno Desktop runtime (libdenort from this branch +
# laufey's webview and CEF backend hosts) for six targets, smoke-tests each
# archive with the STOCK `deno desktop` CLI, runs the e2e suite, attests it,
# builds and smoke-tests this fork's own `deno` CLI for the same targets,
# and on a `denext-runtime-v*` tag publishes a GitHub Release with SHA256SUMS
# and a manifest.json. It runs on a push to development-denext or a rel/**
# branch that changes what the runtime is built from (the paths below: the
# cli / runtime / ext / libs crates, the workspace manifests and toolchain,
# the laufey pin — LAUFEY_SHA below and cli/rt_desktop/Cargo.toml — and this
# workflow with its scripts), by hand, and on a tag (path filters are not
# evaluated for tags), which publishes only when a full `denext tests` run
# (every OS leg, not a branch's Linux-only run) passed on the tagged commit,
# no run of it failed, and it is on development-denext or rel/<version>
# (.github/denext-runtime/tag_gate.py), and only from an annotated tag that
# was never moved. See DENEXT.md.
name: denext runtime

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets to build, or 'all' (aarch64-apple-darwin, x86_64-apple-darwin, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc)"
        type: string
        default: all
      laufey_ref:
        description: 'Brainwires/laufey commit to build the backend hosts from (empty = the pinned LAUFEY_SHA)'
        type: string
        default: ''
      reuse_denort_run_id:
        description: 'Skip the libdenort build and take its artifacts from this earlier run id'
        type: string
        default: ''
      reuse_laufey_run_id:
        description: 'Skip the laufey build and take its artifacts from this earlier run id'
        type: string
        default: ''
      e2e_areas:
        description: 'Comma-separated e2e areas to run (.github/denext-runtime/e2e/run.ts), or empty for all'
        type: string
        default: ''
      cli_only:
        description: 'Dry run of the CLI archives only: build, assemble (with esbuild), smoke-test and list them in manifest.json; no runtime, laufey or release'
        type: boolean
        default: false
  push:
    branches:
      - 'rel/**'
      - 'development-denext'
    tags:
      - 'denext-runtime-v*'
    # Branch pushes only: GitHub does not evaluate path filters for a tag.
    paths:
      - 'cli/**'
      - 'runtime/**'
      - 'ext/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/denext-runtime/**'
      - '.github/workflows/denext_runtime.yml'

permissions:
  contents: read
  # setup reads the `denext tests` runs of a tagged commit.
  actions: read

concurrency:
  group: denext-runtime-${{ github.ref }}-${{ inputs.targets }}-${{ inputs.reuse_denort_run_id }}-${{ inputs.reuse_laufey_run_id }}
  # A newer push to the same branch (or a new dispatch with the same inputs)
  # supersedes a run. A tag's run publishes the release and is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'branch') }}

env:
  # laufey `development-denext` (the Brainwires/laufey fork's stable branch;
  # it replaced `denext/integration`) or a release branch cut from it
  # (`release/denext-1` for 3.0.0-denext.1), pinned to a commit.
  LAUFEY_SHA: 7d24199a19806efffc46be43a50476e96c7eef56
  LAUFEY_REPOSITORY: Brainwires/laufey
  # The stock CLI the archives are smoke-tested with (and that denext runs).
  STOCK_DENO_VERSION: 2.9.8
  # The esbuild every `deno-cli-*` archive ships next to `deno`: the
  # official @esbuild/<platform> binary, pinned by npm integrity in
  # .github/denext-runtime/fetch_esbuild.py. Must equal ESBUILD_VERSION in
  # cli/tools/bundle/esbuild.rs (the cli job checks).
  ESBUILD_VERSION: 0.25.5
  # The Apple Developer Team the macOS release binaries are signed by
  # (sign_macos.sh refuses any other identity and checks the signature
  # against it).
  APPLE_TEAM_ID: WT957SC7MJ
  # The newest glibc version a Linux `deno` / `denort` may require (the fork
  # audit's P2). The cli job links them against upstream Deno's Ubuntu 18.04
  # sysroot (linux_sysroot.sh), so they run on any glibc >= 2.27, and "Check
  # binary" fails one that requires a newer GLIBC_ version
  # (glibc_ceiling.py). denext reads the same value from the pin data before
  # it downloads the toolchain. Only ever lowered, never raised. See
  # DENEXT.md item 151.
  GLIBC_CEILING: '2.27'
  # The engine staleness gate (.github/denext-runtime/engine_staleness.py):
  # a V8 (Cargo.lock's v8 crate) or CEF (laufey's CEF_FULL_VERSION) pin more
  # than one Chrome stable major behind, and not on Chrome's Extended Stable
  # milestone, warns on every run and, with `tag`, fails a release tag;
  # `warn` keeps a tag at a warning. A pin on the Extended Stable milestone
  # only warns, and says it is still patched (DENEXT.md item 179). A failed
  # Chrome stable lookup only warns. `warn` since 3.0.0-denext.3: V8
  # 15.2.124.45 (DENEXT.md item 162) carries the 15.2 branch's security
  # merges, but the gate counts milestones, not patch level, and CEF 150 is
  # behind too, so `tag` would refuse every tag (items 150, 162). It stays
  # `warn` until the fork builds its own current V8 line and the rule gains
  # a patch-age limit.
  ENGINE_STALENESS_ENFORCE: warn

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      deno_version: ${{ steps.plan.outputs.deno_version }}
      upstream_version: ${{ steps.plan.outputs.upstream_version }}
      laufey_sha: ${{ steps.plan.outputs.laufey_sha }}
      cef_version: ${{ steps.plan.outputs.cef_version }}
      laufey_api: ${{ steps.plan.outputs.laufey_api }}
      # The tag gate's verdict (tags only): the full run it accepted, for the
      # release notes.
      full_run: ${{ steps.plan.outputs.full_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            cli/Cargo.toml
            cli/lib/version.txt
            cli/lib/upstream_version.txt
            Cargo.lock
            .github/denext-runtime/tag_gate.py
            .github/denext-runtime/engine_staleness.py
          sparse-checkout-cone-mode: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ inputs.targets || 'all' }}
          LAUFEY_REF: ${{ inputs.laufey_ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # The fork's own version (DENEXT.md "Versioning": 3.0.0-denext.N, ...),
          # which the release is named after, and the upstream Deno release it
          # is built from.
          deno_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -1)
          test -n "$deno_version" ||
            { echo "::error::no version = \"...\" line in cli/Cargo.toml"; exit 1; }
          lib_version=$(tr -d '[:space:]' <cli/lib/version.txt)
          test "$lib_version" = "$deno_version" ||
            { echo "::error::cli/lib/version.txt is '$lib_version', cli/Cargo.toml '$deno_version'"; exit 1; }
          upstream_version=$(tr -d '[:space:]' <cli/lib/upstream_version.txt)
          test -n "$upstream_version" ||
            { echo "::error::cli/lib/upstream_version.txt is empty"; exit 1; }
          python3 - "$deno_version" "$upstream_version" <<'PY'
          import re, sys
          semver = re.compile(r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*)?$")
          for v in sys.argv[1:]:
              if not semver.match(v):
                  raise SystemExit(f"::error::'{v}' is not a semver version without build metadata")
          PY

          ref=${LAUFEY_REF:-$LAUFEY_SHA}
          laufey_sha=$(gh api "repos/$LAUFEY_REPOSITORY/commits/$ref" --jq .sha)
          cef_version=$(gh api "repos/$LAUFEY_REPOSITORY/contents/Makefile?ref=$laufey_sha" --jq .content |
            base64 -d | sed -n 's/^CEF_FULL_VERSION := //p')
          test -n "$cef_version" ||
            { echo "::error::no CEF_FULL_VERSION in $LAUFEY_REPOSITORY's Makefile at $laufey_sha"; exit 1; }
          laufey_api=$(gh api "repos/$LAUFEY_REPOSITORY/contents/capi/include/laufey.h?ref=$laufey_sha" --jq .content |
            base64 -d | sed -n 's/^#define LAUFEY_API_VERSION \([0-9]*\).*/\1/p')
          test -n "$laufey_api" ||
            { echo "::error::no LAUFEY_API_VERSION in $LAUFEY_REPOSITORY's capi/include/laufey.h at $laufey_sha"; exit 1; }

          # Engine staleness: V8 and CEF more than one Chrome stable major
          # behind get no upstream security fixes. Warns on branches, fails a
          # tag (ENGINE_STALENESS_ENFORCE); offline it warns and passes.
          tag_flag=()
          if [ "$REF_TYPE" = tag ]; then tag_flag=(--tag); fi
          python3 -I .github/denext-runtime/engine_staleness.py "${tag_flag[@]}" --cef "$cef_version" ||
            { echo "::error::the engine staleness gate refused this release (see above)"; exit 1; }

          if [ "$REF_TYPE" = tag ]; then
            version=${REF_NAME#denext-runtime-v}
            test "$version" = "$deno_version" ||
              { echo "::error::tag $REF_NAME does not match the fork's version $deno_version (cli/Cargo.toml; want denext-runtime-v$deno_version)"; exit 1; }
            # The tag is immutable (P8): annotated, on exactly this commit,
            # never moved from another commit, and not released before. A
            # failed tag build is fixed by releasing the next version, not by
            # moving the tag.
            tag_obj=$(gh api "repos/$REPO/git/ref/tags/$REF_NAME" --jq '.object.type + " " + .object.sha')
            if [ "${tag_obj%% *}" != tag ]; then
              echo "::error::$REF_NAME is a lightweight tag: release tags must be annotated (git tag -a $REF_NAME -m 'denext runtime $deno_version' <sha>)"
              exit 1
            fi
            tag_commit=$(gh api "repos/$REPO/git/tags/${tag_obj#* }" --jq '.object.type + " " + .object.sha')
            if [ "$tag_commit" != "commit $SHA" ]; then
              echo "::error::$REF_NAME points at '$tag_commit', not commit $SHA"
              exit 1
            fi
            moved=$(gh api --paginate "repos/$REPO/actions/workflows/denext_runtime.yml/runs?branch=$REF_NAME&event=push&per_page=100" \
              --jq ".workflow_runs[] | select(.head_sha != \"$SHA\") | \"\\(.id) \\(.head_sha)\"")
            if [ -n "$moved" ]; then
              echo "::error::$REF_NAME was pushed before on another commit (run, sha: $(tr '\n' ' ' <<<"$moved")): a release tag is never moved; tag the next version instead"
              exit 1
            fi
            if gh release view "$REF_NAME" --repo "$REPO" >/dev/null 2>&1; then
              echo "::error::release $REF_NAME already exists: a published release is never replaced; tag the next version instead"
              exit 1
            fi
            # A release needs a green FULL `denext tests` run (lint, libs,
            # unit, specs on every OS leg, Windows arm64 included) of exactly
            # the tagged commit, no failed run or attempt of it at all (a
            # re-run that passes does not clear one), and the commit on
            # development-denext or rel/<version>. See tag_gate.py.
            if ! gate=$(REPO="$REPO" SHA="$SHA" VERSION="$version" \
              python3 -I .github/denext-runtime/tag_gate.py); then
              echo "$gate"
              echo "::error::the tag gate refused $SHA (see above)"
              exit 1
            fi
            echo "$gate"
            sed -n 's/^full_run=//p' <<<"$gate" | sed 's/^/full_run=/' >>"$GITHUB_OUTPUT"
            TARGETS=all
          else
            # Build metadata: the same precedence as the version it builds
            # toward, never mistaken for a release (DENEXT.md "Versioning").
            version="$deno_version+ci.$RUN_NUMBER"
          fi

          matrix=$(TARGETS="$TARGETS" python3 - <<'PY'
          import json, os
          all_targets = [
              {"target": "aarch64-apple-darwin", "os": "macos-15"},
              {"target": "x86_64-apple-darwin", "os": "macos-15-intel"},
              {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-22.04"},
              {"target": "aarch64-unknown-linux-gnu", "os": "ubuntu-22.04-arm"},
              {"target": "x86_64-pc-windows-msvc", "os": "windows-latest"},
              {"target": "aarch64-pc-windows-msvc", "os": "windows-11-arm"},
          ]
          want = [t.strip() for t in os.environ["TARGETS"].split(",") if t.strip()]
          if want != ["all"]:
              known = {t["target"] for t in all_targets}
              unknown = [t for t in want if t not in known]
              if unknown:
                  raise SystemExit(f"unknown targets: {unknown}")
              all_targets = [t for t in all_targets if t["target"] in want]
          print(json.dumps(all_targets))
          PY
          )
          {
            echo "matrix=$matrix"
            echo "version=$version"
            echo "deno_version=$deno_version"
            echo "upstream_version=$upstream_version"
            echo "laufey_sha=$laufey_sha"
            echo "cef_version=$cef_version"
            echo "laufey_api=$laufey_api"
          } >>"$GITHUB_OUTPUT"
          echo "version=$version deno=$deno_version upstream=$upstream_version laufey=$laufey_sha cef=$cef_version"
          echo "matrix=$matrix"

  # The e2e runner's own logic (.github/denext-runtime/e2e/lib), which needs
  # no runtime, display or build: which result belongs to which launch.
  e2e-harness:
    name: e2e harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/denext-runtime
          sparse-checkout-cone-mode: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.STOCK_DENO_VERSION }}
      # Type-check every e2e module (the runner, the areas and the test apps):
      # `deno run` and the harness tests below skip type checking, so a type
      # error would otherwise land unseen.
      - name: Type-check the e2e TypeScript
        run: deno check --no-config --no-lock $(find .github/denext-runtime/e2e -name '*.ts')
      - run: deno test -A --no-check --no-config --no-lock .github/denext-runtime/e2e/lib/

  # laufey's webview + CEF backend hosts, built the way laufey's own CI does.
  laufey:
    name: laufey / ${{ matrix.target }}
    needs: setup
    if: ${{ !inputs.reuse_laufey_run_id && !inputs.cli_only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.LAUFEY_REPOSITORY }}
          ref: ${{ needs.setup.outputs.laufey_sha }}
          path: laufey

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # man-db triggers can take minutes on hosted runners.
          sudo apt-get -qq remove --purge -y man-db >/dev/null 2>&1 || true
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libx11-dev libxi-dev libglib2.0-dev libnss3-dev libnspr4-dev \
            libatk1.0-dev libatk-bridge2.0-dev libcups2-dev libdrm-dev \
            libgbm-dev libasound2-dev libpango1.0-dev \
            libcairo2-dev libxcomposite-dev libxdamage-dev libxrandr-dev \
            libxkbcommon-dev libdbus-1-dev libxext-dev libxfixes-dev \
            libudev-dev
          # libudev-dev + libdbus-1-dev: laufey's Makefile builds
          # liblaufey_webauthn.so (Linux passkeys with security keys, through
          # libwebauthn) only when both are present; without it the backends
          # report no passkey capability.
          pkg-config --exists libudev dbus-1 ||
            { echo "::error::pkg-config finds no libudev / dbus-1 (liblaufey_webauthn.so would not be built)"; exit 1; }

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: laufey
        run: |
          # Pinned versions (the community packages carry their downloads' checksums).
          choco install make --version=4.4.1 -y --no-progress
          choco install ninja --version=1.13.2 -y --no-progress
          # The WebView2 SDK at a pinned version, checked against its
          # SHA-256 before use (nuget.org's flat container; the .nupkg is a zip).
          WV2_VERSION=1.0.4258.31
          WV2_SHA256=56f7f4b8bf9aee4b8efefbbdd4f67d5f74ebd1b100ed0806da71bf76af481aa9
          curl -fsSL --retry 3 -o wv2.zip "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$WV2_VERSION/microsoft.web.webview2.$WV2_VERSION.nupkg"
          echo "$WV2_SHA256  wv2.zip" | sha256sum -c -
          powershell -NoProfile -Command "Expand-Archive -Path wv2.zip -DestinationPath packages/Microsoft.Web.WebView2.$WV2_VERSION"
          rm wv2.zip

      - name: Cache CEF
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: laufey/vendor/cef
          key: cef-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('laufey/Makefile') }}

      # An ARM64 toolchain on windows-11-arm, so cl.exe targets ARM64 and
      # CMake links the arm64 WebView2 loader.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Build webview host
        working-directory: laufey
        env:
          # Keep in sync with LSMinimumSystemVersion in webview/macos/Info.plist.in.
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          if [ "${{ runner.os }}" = Windows ]; then
            # laufey's Makefile reads the architecture from `uname -m`, which
            # an emulated x64 shell reports as x86_64 on Windows on Arm.
            WEBVIEW2_ROOT="$(pwd)/$(ls -d packages/Microsoft.Web.WebView2.* | head -1)" make webview UNAME_M=${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}
          else
            make webview
          fi

      - name: Build CEF host
        if: runner.os != 'Windows'
        working-directory: laufey
        run: make cef

      # As in laufey's build-cef: make runs from pwsh on Windows, where the
      # Windows tar extracts the CEF dist (Git bash's GNU tar reads "D:/..." as
      # a remote host).
      - name: Build CEF host (Windows)
        if: runner.os == 'Windows'
        working-directory: laufey
        shell: pwsh
        # UNAME_M: the windowsarm64 CEF dist on windows-11-arm (see the
        # webview step).
        run: make cef UNAME_M=${{ runner.arch == 'ARM64' && 'aarch64' || 'x86_64' }}

      # Only the backends' runtime files: `deno desktop` copies the whole
      # directory holding a Linux/Windows backend binary into the app.
      - name: Stage
        env:
          LAUFEY_SHA: ${{ needs.setup.outputs.laufey_sha }}
        run: |
          set -euo pipefail
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null; then tmp=$(cygpath -u "$tmp"); fi
          st="$tmp/laufey-stage"
          rm -rf "$st"
          mkdir -p "$st/webview/build" "$st/cef/build" "$st/licenses"
          case "${{ runner.os }}" in
            macOS)
              ditto laufey/webview/build/laufey_webview.app "$st/webview/build/laufey_webview.app"
              mkdir -p "$st/cef/build/Release"
              ditto laufey/cef/build/Release/laufey.app "$st/cef/build/Release/laufey.app"
              ;;
            Linux)
              cp laufey/webview/build/laufey_webview "$st/webview/build/"
              # Passkeys: each host dlopen()s liblaufey_webauthn.so from its
              # own directory (laufey's Makefile copies it into both build
              # dirs; CEF's comes with the whole Release dir).
              cp laufey/webview/build/liblaufey_webauthn.so "$st/webview/build/"
              cp -a laufey/cef/build/Release "$st/cef/build/Release"
              test -f "$st/cef/build/Release/liblaufey_webauthn.so" ||
                { echo "::error::laufey's cef/build/Release has no liblaufey_webauthn.so (make cef did not copy it)"; exit 1; }
              strip --strip-unneeded "$st/cef/build/Release/libcef.so"
              # libwebauthn is LGPL-2.1-or-later: its license, and where the
              # library's source is, go with it.
              lw_version=$(awk '/^name = "libwebauthn"$/{getline; gsub(/"/, "", $3); print $3}' laufey/webauthn-linux/Cargo.lock)
              # crates.io, or a [patch] git source (RUSTSEC-2026-0387: laufey
              # builds Brainwires/libwebauthn at a pinned rev).
              lw_source=$(awk '/^name = "libwebauthn"$/{getline; getline; sub(/^source = "/, ""); sub(/"$/, ""); print}' laufey/webauthn-linux/Cargo.lock)
              cargo_home="${CARGO_HOME:-$HOME/.cargo}"
              case "$lw_source" in
                git+*)
                  lw_repo=${lw_source#git+}; lw_repo=${lw_repo%%\?*}; lw_repo=${lw_repo%.git}
                  lw_rev=${lw_source##*#}
                  lw_dir=$(find "$cargo_home/git/checkouts" -mindepth 2 -maxdepth 2 -type d -path "*/libwebauthn-*/${lw_rev:0:7}" | head -1)
                  lw_where="$lw_repo/tree/$lw_rev (libwebauthn $lw_version with the RUSTSEC-2026-0387 dependency update)"
                  ;;
                *)
                  lw_dir=$(find "$cargo_home/registry/src" -mindepth 2 -maxdepth 2 -type d -name "libwebauthn-$lw_version" | head -1)
                  lw_where="https://crates.io/crates/libwebauthn/$lw_version"
                  ;;
              esac
              if [ ! -f "$lw_dir/COPYING" ]; then
                echo "::error::libwebauthn's COPYING not found (source: $lw_source, dir: '$lw_dir')"
                exit 1
              fi
              mkdir -p "$st/licenses/libwebauthn"
              cp "$lw_dir/COPYING" "$st/licenses/libwebauthn/COPYING"
              cat >"$st/licenses/libwebauthn/NOTICE" <<EOF
          liblaufey_webauthn.so (beside the webview and CEF hosts) contains
          libwebauthn $lw_version (LGPL-2.1-or-later, COPYING here), source:
          $lw_where
          It is built from https://github.com/Brainwires/laufey/tree/$LAUFEY_SHA/webauthn-linux
          (make webauthn-linux) and may be replaced by a library built the same way.
          EOF
              ;;
            Windows)
              cp laufey/webview/build/laufey_webview.exe "$st/webview/build/"
              cp -r laufey/cef/build/Release "$st/cef/build/Release"
              find "$st/cef/build/Release" -maxdepth 1 -type f \
                \( -iname '*.pdb' -o -iname '*.lib' -o -iname '*.exp' -o -iname '*.ilk' \) -print -delete
              ;;
          esac
          cp laufey/LICENSE laufey/LICENSE.cef "$st/licenses/"
          echo "$LAUFEY_SHA" >"$st/licenses/LAUFEY_SHA"
          # The C ABI version the hosts were built with (checked against the
          # one libdenort was compiled with in the package job).
          sed -n 's/^#define LAUFEY_API_VERSION \([0-9]*\).*/\1/p' laufey/capi/include/laufey.h >"$st/LAUFEY_API_VERSION"
          test -s "$st/LAUFEY_API_VERSION" ||
            { echo "::error::no LAUFEY_API_VERSION in laufey/capi/include/laufey.h"; exit 1; }
          echo "laufey API $(cat "$st/LAUFEY_API_VERSION")"
          find "$st" -maxdepth 4 | sort
          du -sh "$st"/webview "$st"/cef
          mkdir -p out
          tar -cf "out/laufey-${{ matrix.target }}.tar" -C "$st" .

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laufey-${{ matrix.target }}
          path: out/laufey-${{ matrix.target }}.tar
          retention-days: 14

  # libdenort (the `denort_desktop` cdylib) from this branch, release profile
  # (fat LTO, codegen-units=1, opt-level=z), as deno's own release builds it.
  denort:
    name: denort / ${{ matrix.target }}
    needs: setup
    if: ${{ !inputs.reuse_denort_run_id && !inputs.cli_only }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    # Attests its debug symbol archive (DENEXT.md item 181).
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # man-db triggers can take minutes on hosted runners.
          sudo apt-get -qq remove --purge -y man-db >/dev/null 2>&1 || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev cmake

      - name: libclang (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
          # VS's own LLVM (x64, or ARM64 on windows-11-arm), else a system one.
          for d in "$(cygpath -u "$vs")/VC/Tools/Llvm/${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}/bin" "$(cygpath -u "$vs")/VC/Tools/Llvm/x64/bin" "/c/Program Files/LLVM/bin"; do
            if [ -f "$d/libclang.dll" ]; then
              echo "LIBCLANG_PATH=$(cygpath -w "$d")" >>"$GITHUB_ENV"
              echo "LIBCLANG_PATH=$(cygpath -w "$d")"
              exit 0
            fi
          done
          echo "::error::libclang.dll not found"; exit 1

      # ld64.lld: the aarch64-apple-darwin rustflags in .cargo/config.toml link
      # with -fuse-ld=lld, as deno's release does. The Deno that fetches it is
      # pinned and the linker is checked against a pinned SHA-256: this job
      # attests what it builds.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          deno-version: ${{ env.STOCK_DENO_VERSION }}
      - name: Install ld64.lld (macOS aarch64)
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/denext-runtime/install_ld64.sh

      - name: Rust toolchain
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          # Name the host on Windows on Arm: an emulated x64 rustup would
          # otherwise install (and build with) an x86_64 toolchain.
          if [ "${{ matrix.target }}" = aarch64-pc-windows-msvc ]; then tc="$tc-${{ matrix.target }}"; fi
          rustup toolchain install "$tc" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$tc" >>"$GITHUB_ENV"

      # The `v8` crate is Brainwires/rusty_v8 (Cargo.toml's [patch.crates-io]):
      # its prebuilt library and binding come from that repository's release,
      # checked against .github/denext-runtime/rusty_v8.sha256, never from
      # denoland's (DENEXT.md item 162). Fails closed.
      - name: Prebuilt V8
        # --seed-dir: the cache restores the v8 build-script fingerprint but
        # not target/release/gn_out, where the script puts the library.
        run: python3 -I .github/denext-runtime/fetch_rusty_v8.py --target "${{ matrix.target }}" --dest "$RUNNER_TEMP/rusty_v8" --seed-dir target/release --github-env

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: denext-denort-v1
          key: ${{ matrix.target }}-${{ matrix.os }}
          cache-on-failure: false

      # The laufey crate libdenort links and the backend hosts must come from
      # the SAME laufey revision: laufey's init_api rejects any C ABI version
      # mismatch. Build against the host's laufey source by patching whatever
      # source Cargo.lock names for `laufey` (crates.io today, a git rev of
      # Brainwires/laufey later) with a path to that checkout.
      # Outside the deno checkout: a path dependency under the workspace root
      # would become a deno workspace member.
      - name: Fetch laufey source
        env:
          LAUFEY_SHA: ${{ needs.setup.outputs.laufey_sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/laufey-src"
          if command -v cygpath >/dev/null; then dir="$(cygpath -u "$RUNNER_TEMP")/laufey-src"; fi
          rm -rf "$dir"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth=1 "https://github.com/$LAUFEY_REPOSITORY" "$LAUFEY_SHA"
          git -C "$dir" checkout -q FETCH_HEAD
          echo "LAUFEY_SRC=$dir" >>"$GITHUB_ENV"

      - name: Build libdenort
        run: |
          set -euo pipefail
          src=$(awk '/^name = "laufey"$/{f=1} f&&/^source = /{print; exit}' Cargo.lock | sed 's/^source = "\(.*\)"$/\1/')
          echo "Cargo.lock laufey source: $src"
          case "$src" in
            registry+https://github.com/rust-lang/crates.io-index) key=crates-io ;;
            git+*) url=${src#git+}; url=${url%%\#*}; url=${url%%\?*}; key="\"$url\"" ;;
            *) echo "::error::unexpected laufey source '$src'"; exit 1 ;;
          esac
          capi="$LAUFEY_SRC/capi"
          if command -v cygpath >/dev/null; then capi=$(cygpath -m "$capi"); fi
          patch="patch.$key.laufey.path=\"$capi\""
          echo "cargo --config '$patch'"
          df -h . || true
          # The patch rewrites the laufey entry of Cargo.lock: let cargo do
          # that first, check nothing but laufey moved (every other package's
          # name, version, source, checksum and dependencies), then build
          # --locked against exactly that lockfile.
          mkdir -p target
          cp Cargo.lock target/Cargo.lock.orig
          cargo metadata --format-version 1 --config "$patch" >/dev/null
          git diff --stat -- Cargo.lock
          python3 .github/denext-runtime/lock_drift.py target/Cargo.lock.orig Cargo.lock
          # panic-trace: crash reports carry a stack trace (DENEXT.md item 180).
          cargo build --release --locked --config "$patch" -p denort_desktop --features panic-trace
          df -h . || true
          # Record what libdenort was compiled against.
          manifest=$(cargo metadata --format-version 1 --config "$patch" |
            python3 -c 'import json,sys; print([p for p in json.load(sys.stdin)["packages"] if p["name"]=="laufey"][0]["manifest_path"])')
          echo "laufey crate compiled from: $manifest"
          if command -v cygpath >/dev/null; then manifest=$(cygpath -u "$manifest"); fi
          api=$(sed -n 's/^pub const LAUFEY_API_VERSION: u32 = \([0-9]*\);/\1/p' "$(dirname "$manifest")/src/lib.rs")
          test -n "$api" ||
            { echo "::error::no 'pub const LAUFEY_API_VERSION: u32' in $(dirname "$manifest")/src/lib.rs (the laufey crate libdenort compiled against)"; exit 1; }
          mkdir -p out
          echo "$api" >out/LAUFEY_API_VERSION
          git -C "$LAUFEY_SRC" rev-parse HEAD >out/LAUFEY_SHA
          echo "laufey API $api at $(cat out/LAUFEY_SHA)"

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p out
          case "${{ matrix.target }}" in
            *-apple-darwin)
              cp target/release/libdenort.dylib out/
              strip -x -S out/libdenort.dylib
              # Don't ship the build machine's target/ path as the install name.
              install_name_tool -id @rpath/libdenort.dylib out/libdenort.dylib
              # Stripping invalidates the linker's ad-hoc signature, and arm64
              # macOS refuses to map unsigned code; re-sign ad hoc. Apps are
              # signed with the author's identity at package time.
              codesign --force --sign - out/libdenort.dylib
              file out/libdenort.dylib
              lipo -info out/libdenort.dylib
              otool -L out/libdenort.dylib
              ;;
            *-linux-gnu)
              cp target/release/libdenort.so out/
              strip --strip-debug out/libdenort.so
              file out/libdenort.so
              ldd out/libdenort.so || true
              objdump -T out/libdenort.so | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3
              # Its calls to its own exported functions (the brotli C API
              # node:zlib uses, temporal_rs, napi_*) bind inside it, never to
              # a same-named library the host loaded (DENEXT.md item 187).
              python3 -I .github/denext-runtime/self_binding.py out/libdenort.so
              ;;
            *-windows-msvc)
              cp target/release/denort.dll out/
              case "${{ matrix.target }}" in aarch64-*) machine=arm64 ;; *) machine=x64 ;; esac
              python .github/denext-runtime/pe_deps.py "$machine" out/denort.dll
              ;;
          esac
          ls -la out

      # The signatures go on before the package job archives (and pins) the
      # library, so the SHA-256 in manifest.json is the signed file's.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash .github/denext-runtime/sign_macos.sh out/libdenort.dylib

      - name: Sign (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: '& ./.github/denext-runtime/sign_windows.ps1 out/denort.dll'

      # The release profile's split debug info (Cargo.toml: packed,
      # line-tables-only), so a crash address in a shipped libdenort can be
      # symbolicated. Tags (release assets) and dispatches only.
      - name: Debug symbols
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: bash .github/denext-runtime/collect_symbols.sh "deno-desktop-runtime-symbols-$VERSION-${{ matrix.target }}" symbols ${{ runner.os == 'Windows' && 'denort.dll' || runner.os == 'macOS' && 'libdenort.dylib' || 'libdenort.so' }}

      # Maintainers symbolicate crash traces with these
      # (symbolicate.py): attested like the archives they describe.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          subject-path: symbols/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: symbols-denort-${{ matrix.target }}
          path: symbols/
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: denort-${{ matrix.target }}
          path: out/
          retention-days: 14

  # This fork's own `deno` CLI (the CLI-side features: Vitest compatibility in
  # `deno test`, `Deno.SQL`, ...), release profile, with DENEXT_VERSION baked
  # in so `deno --version` names the build. It needs no laufey patch: the CLI
  # does not link the laufey crate. Smoke-tested from its archive on the
  # target's own runner, then attested.
  cli:
    name: cli / ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - name: Configure git
        run: |
          git config --global core.symlinks true
          git config --global core.longpaths true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          submodules: false

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # The release build's last phase compiles the `deno` and `denort`
      # crates side by side. On the arm64 runner every 3.0.0-denext.3 run
      # lost the runner about 5 minutes into that phase ("The runner has
      # received a shutdown signal", exit 143, disk 120 GB free), most likely
      # out of memory; denext.2's build finished it. Swap keeps the one cargo
      # invocation, so the binaries and their feature set are unchanged.
      - name: Swap (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          free -h
          sudo fallocate -l 16G /denext-swapfile
          sudo chmod 600 /denext-swapfile
          sudo mkswap /denext-swapfile >/dev/null
          sudo swapon /denext-swapfile
          free -h

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # man-db triggers can take minutes on hosted runners.
          sudo apt-get -qq remove --purge -y man-db >/dev/null 2>&1 || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libclang-dev cmake

      - name: libclang (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property installationPath)
          # VS's own LLVM (x64, or ARM64 on windows-11-arm), else a system one.
          for d in "$(cygpath -u "$vs")/VC/Tools/Llvm/${{ runner.arch == 'ARM64' && 'ARM64' || 'x64' }}/bin" "$(cygpath -u "$vs")/VC/Tools/Llvm/x64/bin" "/c/Program Files/LLVM/bin"; do
            if [ -f "$d/libclang.dll" ]; then
              echo "LIBCLANG_PATH=$(cygpath -w "$d")" >>"$GITHUB_ENV"
              echo "LIBCLANG_PATH=$(cygpath -w "$d")"
              exit 0
            fi
          done
          echo "::error::libclang.dll not found"; exit 1

      # ld64.lld: the aarch64-apple-darwin rustflags in .cargo/config.toml link
      # with -fuse-ld=lld, as deno's release does. The Deno that fetches it is
      # pinned and the linker is checked against a pinned SHA-256: this job
      # attests what it builds.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          deno-version: ${{ env.STOCK_DENO_VERSION }}
      - name: Install ld64.lld (macOS aarch64)
        if: matrix.target == 'aarch64-apple-darwin'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/denext-runtime/install_ld64.sh

      - name: Rust toolchain
        run: |
          tc=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          # Name the host on Windows on Arm: an emulated x64 rustup would
          # otherwise install (and build with) an x86_64 toolchain.
          if [ "${{ matrix.target }}" = aarch64-pc-windows-msvc ]; then tc="$tc-${{ matrix.target }}"; fi
          rustup toolchain install "$tc" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$tc" >>"$GITHUB_ENV"

      # The `v8` crate is Brainwires/rusty_v8 (Cargo.toml's [patch.crates-io]):
      # its prebuilt library and binding come from that repository's release,
      # checked against .github/denext-runtime/rusty_v8.sha256, never from
      # denoland's (DENEXT.md item 162). Fails closed.
      - name: Prebuilt V8
        # --seed-dir: the cache restores the v8 build-script fingerprint but
        # not target/release/gn_out, where the script puts the library.
        run: python3 -I .github/denext-runtime/fetch_rusty_v8.py --target "${{ matrix.target }}" --dest "$RUNNER_TEMP/rusty_v8" --seed-dir target/release --github-env

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: denext-cli-v2
          key: ${{ matrix.target }}-${{ matrix.os }}
          cache-on-failure: false

      # Linux: link against upstream Deno's glibc 2.27 sysroot (clang + lld,
      # the sysroot's flags and tools/'s shims) instead of the runner's glibc
      # 2.35, so the binaries run on RHEL 8 / 9, Amazon Linux 2023, Debian 10+
      # and Ubuntu 18.04+. Writes CC, CFLAGS and the target's cargo linker and
      # rustflags to $GITHUB_ENV, and mounts the sysroot for "Check binary".
      - name: glibc 2.27 sysroot (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: bash .github/denext-runtime/linux_sysroot.sh "$TARGET"

      # And `denort`, the standalone runtime `deno compile` puts under a
      # compiled app: this CLI downloads the release's own
      # (deno-denort-<version>-<target>.zip; cli/standalone/binary.rs,
      # denext_denort), never Deno's stock one.
      - name: Build deno + denort
        env:
          # Deno.version.deno, `deno --version` and the user agent
          # (cli/lib/version.rs, denext_version), in a compiled app too;
          # libdenort downloads keep the plain Deno version.
          DENEXT_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          df -h . || true
          # panic-trace: the panic banner and crash reports carry a stack
          # trace for symbolicate.py (DENEXT.md item 180).
          cargo build --release --locked --bin deno --bin denort --features deno/panic-trace,denort/panic-trace
          df -h . || true
          git diff --exit-code -- Cargo.lock

      - name: Check binary
        run: |
          set -euo pipefail
          case "$TARGET" in
            *-apple-darwin)
              for b in target/release/deno target/release/denort; do
                file "$b"
                lipo -info "$b"
                otool -L "$b"
                # arm64 macOS refuses to run unsigned code. The arm64 linker
                # signs ad hoc; sign the x86_64 binaries the same way.
                if ! codesign --verify "$b" 2>/dev/null; then
                  codesign --force --sign - "$b"
                fi
                codesign --verify --verbose "$b"
              done
              ;;
            *-linux-gnu)
              for b in target/release/deno target/release/denort; do
                file "$b"
                ldd "$b" || true
              done
              # The newest glibc each binary requires (its version
              # references), at most GLIBC_CEILING: an older distro fails to
              # exec a binary that needs a newer one.
              python3 -I .github/denext-runtime/glibc_ceiling.py "$GLIBC_CEILING" target/release/deno target/release/denort
              # And they run on that glibc: inside the sysroot (Ubuntu 18.04,
              # glibc 2.27) that linux_sysroot.sh mounted. denort has no app
              # embedded, so it gets as far as looking for one.
              sudo chroot /sysroot "$PWD/target/release/deno" --version
              sudo chroot /sysroot "$PWD/target/release/deno" eval 'console.log(`eval ok on ${Deno.build.target}`)'
              out=$(sudo chroot /sysroot "$PWD/target/release/denort" 2>&1 || true)
              if ! grep -q 'Could not find standalone binary section' <<<"$out"; then
                echo "::error::denort did not start in the glibc 2.27 sysroot: $out"
                exit 1
              fi
              ;;
            *-windows-msvc)
              ls -la target/release/deno.exe target/release/denort.exe
              # The machine type is the target's (an x64 toolchain on
              # windows-11-arm would build x64 binaries).
              case "$TARGET" in aarch64-*) machine=arm64 ;; *) machine=x64 ;; esac
              python .github/denext-runtime/pe_deps.py "$machine" target/release/deno.exe target/release/denort.exe
              ;;
          esac

      # Developer ID + notarization (macOS) / Authenticode (Windows), before
      # Assemble: the archives and their SHA-256 pins are made from the
      # signed binaries, and the smoke tests below run them.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_CERT: ${{ secrets.APPLE_DEVELOPER_ID_CERT }}
          APPLE_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash .github/denext-runtime/sign_macos.sh --entitlements cli/entitlements.plist target/release/deno target/release/denort

      - name: Sign (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: '& ./.github/denext-runtime/sign_windows.ps1 target/release/deno.exe target/release/denort.exe'

      # The split debug info of deno and denort (see the denort job's
      # "Debug symbols"). Tags (release assets) and dispatches only.
      - name: Debug symbols
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: bash .github/denext-runtime/collect_symbols.sh "deno-symbols-$VERSION-$TARGET" symbols ${{ runner.os == 'Windows' && 'deno.exe denort.exe' || 'deno denort' }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          subject-path: symbols/*.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: symbols-cli-${{ matrix.target }}
          path: symbols/
          retention-days: 14
          if-no-files-found: warn

      # The official esbuild for this target, verified against its pinned npm
      # integrity (and the registry's), for `deno bundle` to use offline.
      - name: Fetch esbuild
        run: |
          set -euo pipefail
          rs=$(sed -n 's/^pub const ESBUILD_VERSION: &str = "\(.*\)";$/\1/p' cli/tools/bundle/esbuild.rs)
          test "$rs" = "$ESBUILD_VERSION" ||
            { echo "::error::cli/tools/bundle/esbuild.rs pins esbuild '$rs', the workflow ships '$ESBUILD_VERSION'"; exit 1; }
          py=python3; command -v python3 >/dev/null 2>&1 || py=python
          "$py" -I .github/denext-runtime/fetch_esbuild.py "$TARGET" "$RUNNER_TEMP/esbuild"

      # The pinned TypeScript 7 nightly that `deno lsp`'s tsgo backend runs
      # (cli/tsc/typescript_pins.json, role "lsp"; unstable, off by default),
      # verified against its pinned npm integrity and shipped beside deno as
      # typescript-lsp/ so the backend never downloads one.
      - name: Fetch TypeScript (lsp)
        run: |
          set -euo pipefail
          py=python3; command -v python3 >/dev/null 2>&1 || py=python
          "$py" -I .github/denext-runtime/fetch_typescript.py lsp "$TARGET" "$RUNNER_TEMP/typescript-lsp"

      # The pinned TypeScript 7.0 that `deno check` and every other
      # type-checking command run by default (role "check"), verified the same
      # way and shipped beside deno as typescript-check/: type checking never
      # downloads a compiler.
      - name: Fetch TypeScript (check)
        run: |
          set -euo pipefail
          py=python3; command -v python3 >/dev/null 2>&1 || py=python
          "$py" -I .github/denext-runtime/fetch_typescript.py check "$TARGET" "$RUNNER_TEMP/typescript-check"

      # The pinned tsgolint that `deno lint --type-aware` runs
      # (cli/tools/lint/tsgolint_pin.json), verified against its pinned npm
      # integrity and binary sha256 and shipped beside deno as tsgolint/, so
      # type-aware linting works offline.
      - name: Fetch tsgolint
        run: |
          set -euo pipefail
          py=python3; command -v python3 >/dev/null 2>&1 || py=python
          "$py" -I .github/denext-runtime/fetch_tsgolint.py "$TARGET" "$RUNNER_TEMP/tsgolint"

      - name: Assemble
        env:
          DENO_BIN: target/release/${{ runner.os == 'Windows' && 'deno.exe' || 'deno' }}
          DENORT_BIN: target/release/${{ runner.os == 'Windows' && 'denort.exe' || 'denort' }}
          ESBUILD_DIR: ${{ runner.temp }}/esbuild
          TYPESCRIPT_LSP_DIR: ${{ runner.temp }}/typescript-lsp
          TYPESCRIPT_CHECK_DIR: ${{ runner.temp }}/typescript-check
          TSGOLINT_DIR: ${{ runner.temp }}/tsgolint
          OUT_DIR: dist
          # The upstream Deno release the fork is built from (BUILD_INFO.json's
          # and manifest.json's deno.version; denext's pins read it as `deno`).
          DENO_VERSION: ${{ needs.setup.outputs.upstream_version }}
          DENO_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/denext-runtime/assemble_cli.sh

      # `deno --version` and Deno.version.deno name the build,
      # `typeof Deno.SQL` is "function", a Vitest suite passes under
      # `deno test`, the shipped esbuild is ESBUILD_VERSION and `deno bundle`
      # uses it with no npm registry, all from the unpacked archive.
      - name: Smoke
        env:
          ARCHIVE: dist/deno-cli-${{ needs.setup.outputs.version }}-${{ matrix.target }}.zip
          WORK_DIR: ${{ runner.temp }}/cli-smoke
        run: bash .github/denext-runtime/cli_smoke.sh

      # `deno compile` from the unpacked CLI onto the unpacked denort archive
      # (DENORT_BIN: the release URL only exists once it is published): the
      # compiled app has Deno.SQL and names this release.
      - name: Smoke (denort)
        env:
          ARCHIVE: dist/deno-cli-${{ needs.setup.outputs.version }}-${{ matrix.target }}.zip
          DENORT_ARCHIVE: dist/deno-denort-${{ needs.setup.outputs.version }}-${{ matrix.target }}.zip
          WORK_DIR: ${{ runner.temp }}/denort-smoke
        run: bash .github/denext-runtime/denort_smoke.sh

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### cli / $TARGET"
            echo '```'
            cat dist/*.sha256 2>/dev/null || true
            head -1 "$RUNNER_TEMP/cli-smoke/version.txt" 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: dist/
          retention-days: 30

  # Assemble the archives, check them, package the smoke app with the stock
  # CLI, try to launch it, run the e2e suite (.github/denext-runtime/e2e)
  # on both backends, attest.
  # `always()` lets it run when laufey or denort was skipped because a
  # reuse_*_run_id supplies its artifacts. A failed laufey or denort skips it:
  # running anyway only failed in download-artifact and then in every
  # `!cancelled()` e2e step, burying the build failure under red packaging.
  package:
    name: package / ${{ matrix.target }}
    needs: [setup, laufey, denort]
    if: ${{ always() && !inputs.cli_only && needs.setup.result == 'success' && (needs.laufey.result == 'success' || (needs.laufey.result == 'skipped' && inputs.reuse_laufey_run_id != '')) && (needs.denort.result == 'success' || (needs.denort.result == 'skipped' && inputs.reuse_denort_run_id != '')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/denext-runtime
            LICENSE.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: denort-${{ matrix.target }}
          path: dl/denort
          run-id: ${{ inputs.reuse_denort_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: laufey-${{ matrix.target }}
          path: dl/laufey
          run-id: ${{ inputs.reuse_laufey_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # man-db triggers can take minutes on hosted runners.
          sudo apt-get -qq remove --purge -y man-db >/dev/null 2>&1 || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus dbus-x11 \
            libwebkit2gtk-4.1-0 libgtk-3-0 libnss3 libnspr4 libatk1.0-0 \
            libatk-bridge2.0-0 libcups2 libdrm2 libgbm1 libasound2 libpango-1.0-0 \
            libcairo2 libxcomposite1 libxdamage1 libxrandr2 libxkbcommon0 libxi6 \
            libxext6 libxfixes3 libdbus-1-3 file \
            xfwm4 wmctrl xdotool xdg-utils desktop-file-utils \
            python3-gi gir1.2-glib-2.0 libglib2.0-bin openssl \
            gnome-keyring gcr

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.STOCK_DENO_VERSION }}

      # cl/lib for the Node-API probe addon smoke.sh builds into the app.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        if: runner.os == 'Windows'
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      # laufey's init_api rejects any C ABI mismatch between the runtime and
      # the host; fail here instead of at an app's first launch.
      - name: Check laufey ABI (libdenort vs hosts)
        run: |
          set -euo pipefail
          host_api=$(tar -xOf "dl/laufey/laufey-$TARGET.tar" ./LAUFEY_API_VERSION)
          host_sha=$(tar -xOf "dl/laufey/laufey-$TARGET.tar" ./licenses/LAUFEY_SHA)
          rt_api=$(cat dl/denort/LAUFEY_API_VERSION)
          rt_sha=$(cat dl/denort/LAUFEY_SHA)
          echo "libdenort: laufey API $rt_api from $rt_sha"
          echo "hosts:     laufey API $host_api from $host_sha"
          if [ "$rt_api" != "$host_api" ]; then
            echo "::error::laufey API mismatch: libdenort $rt_api, hosts $host_api"; exit 1
          fi
          if [ "$rt_sha" != "$host_sha" ]; then
            echo "::error::laufey revision mismatch: libdenort $rt_sha, hosts $host_sha"; exit 1
          fi
          echo "LAUFEY_API_VERSION=$host_api" >>"$GITHUB_ENV"

      - name: Assemble
        env:
          DENORT_DIR: dl/denort
          LAUFEY_TAR: dl/laufey/laufey-${{ matrix.target }}.tar
          OUT_DIR: dist
          # The upstream Deno release the fork is built from (BUILD_INFO.json's
          # and manifest.json's deno.version; denext's pins read it as `deno`).
          DENO_VERSION: ${{ needs.setup.outputs.upstream_version }}
          DENO_SHA: ${{ github.sha }}
          LAUFEY_SHA: ${{ needs.setup.outputs.laufey_sha }}
          CEF_VERSION: ${{ needs.setup.outputs.cef_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/denext-runtime/assemble.sh

      - name: Verify binaries
        run: |
          set -euo pipefail
          . .github/denext-runtime/lib.sh
          ext=$(archive_ext "$TARGET")
          for backend in webview cef; do
            d="$(unix_path "$RUNNER_TEMP")/verify-$backend"
            rm -rf "$d"
            unpack_archive "dist/deno-desktop-runtime-$VERSION-$TARGET-$backend.$ext" "$d"
            echo "::group::verify $backend"
            bash .github/denext-runtime/verify.sh "$TARGET" "$d"
            echo "::endgroup::"
          done

      - name: Smoke (package, webview)
        env:
          ARCHIVE: dist/deno-desktop-runtime-${{ needs.setup.outputs.version }}-${{ matrix.target }}-webview.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          BACKEND: webview
          WORK_DIR: ${{ runner.temp }}/smoke-webview
        run: bash .github/denext-runtime/smoke.sh

      - name: Smoke (package, cef)
        env:
          ARCHIVE: dist/deno-desktop-runtime-${{ needs.setup.outputs.version }}-${{ matrix.target }}-cef.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          BACKEND: cef
          WORK_DIR: ${{ runner.temp }}/smoke-cef
        run: bash .github/denext-runtime/smoke.sh

      # Launch = the real load check: the host loads libdenort (laufey's
      # init_api rejects an ABI mismatch), the page loads from the app origin
      # and a POST reaches Deno.serve. The app also loads the Node-API probe
      # addon (.github/denext-runtime/napi-probe), linked and looked up at run
      # time, from inside the host. Linux runs under Xvfb.
      - name: Smoke (launch, webview)
        id: launch_webview
        env:
          BACKEND: webview
          WORK_DIR: ${{ runner.temp }}/smoke-webview
        run: bash .github/denext-runtime/launch.sh

      - name: Smoke (launch, cef)
        id: launch_cef
        env:
          BACKEND: cef
          WORK_DIR: ${{ runner.temp }}/smoke-cef
        run: bash .github/denext-runtime/launch.sh

      # The e2e suite: one small app per feature area, packaged with the
      # stock CLI against this archive and driven the way the OS would
      # (deep links through the registered handler, the .msi on Windows, a
      # full-app self-update, ...). Every check passes, fails, or is n/a with
      # the reason. See .github/denext-runtime/e2e/run.ts and DENEXT.md.
      - name: E2E (webview)
        id: e2e_webview
        if: ${{ !cancelled() }}
        env:
          ARCHIVE: dist/deno-desktop-runtime-${{ needs.setup.outputs.version }}-${{ matrix.target }}-webview.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          BACKEND: webview
          WORK_DIR: ${{ runner.temp }}/e2e-webview
          E2E_OUT: ${{ runner.temp }}/e2e-out
          E2E_AREAS: ${{ inputs.e2e_areas }}
        run: bash .github/denext-runtime/e2e/e2e.sh

      - name: E2E (cef)
        id: e2e_cef
        if: ${{ !cancelled() }}
        env:
          ARCHIVE: dist/deno-desktop-runtime-${{ needs.setup.outputs.version }}-${{ matrix.target }}-cef.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          BACKEND: cef
          WORK_DIR: ${{ runner.temp }}/e2e-cef
          E2E_OUT: ${{ runner.temp }}/e2e-out
          E2E_AREAS: ${{ inputs.e2e_areas }}
        run: bash .github/denext-runtime/e2e/e2e.sh

      # A real gnome-keyring whose login keyring is locked, gcr's prompter
      # installed, an Xvfb display and XDG_SESSION_TYPE unset (as under cron
      # or xvfb-run in a systemd service): no one can unlock it, so CEF must
      # pick --password-store=basic (laufey API 45) and nothing that carries
      # a cookie may stall.
      - name: E2E (cef, keyring locked, no session type)
        id: e2e_keyring_locked
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          ARCHIVE: dist/deno-desktop-runtime-${{ needs.setup.outputs.version }}-${{ matrix.target }}-cef.tar.gz
          BACKEND: cef
          WORK_DIR: ${{ runner.temp }}/e2e-keyring
          E2E_OUT: ${{ runner.temp }}/e2e-out-keyring
          # The n/a baseline key (e2e/expected-na.json).
          E2E_VARIANT: keyring-locked
          E2E_AREAS: keyring
          E2E_SECRET_SERVICE: locked
          E2E_SESSION_TYPE: unset
        run: bash .github/denext-runtime/e2e/e2e.sh

      # The same locked keyring on a GNOME session where KDE's wallet is
      # installed (kwalletd5 / 6 activatable, not running): Chromium uses
      # libsecret there, so KWallet must not count and CEF still picks basic.
      - name: E2E (cef, keyring locked, KWallet activatable on GNOME)
        id: e2e_keyring_kwallet
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          ARCHIVE: dist/deno-desktop-runtime-${{ needs.setup.outputs.version }}-${{ matrix.target }}-cef.tar.gz
          BACKEND: cef
          WORK_DIR: ${{ runner.temp }}/e2e-keyring-kwallet
          E2E_OUT: ${{ runner.temp }}/e2e-out-keyring-kwallet
          # The n/a baseline key (e2e/expected-na.json).
          E2E_VARIANT: keyring-kwallet
          E2E_AREAS: keyring
          E2E_SECRET_SERVICE: locked
          E2E_SESSION_TYPE: unset
          E2E_KWALLET: activatable
        run: bash .github/denext-runtime/e2e/e2e.sh

      # One profile across launches with that keyring locked and unlocked in
      # turn: a profile holding cookies encrypted with the OS key (v11) must
      # never be switched to --password-store=basic (Chromium would delete
      # them); the launch that can't reach the key waits for it, and the
      # cookies are still there once the keyring is unlocked.
      - name: E2E (cef, OS-key cookies survive a locked keyring)
        id: e2e_keyring_persist
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        env:
          ARCHIVE: dist/deno-desktop-runtime-${{ needs.setup.outputs.version }}-${{ matrix.target }}-cef.tar.gz
          BACKEND: cef
          WORK_DIR: ${{ runner.temp }}/e2e-keyring-persist
          E2E_OUT: ${{ runner.temp }}/e2e-out-keyring-persist
          # The n/a baseline key (e2e/expected-na.json).
          E2E_VARIANT: keyring-persist
          E2E_AREAS: keyringpersist
          E2E_SECRET_SERVICE: locked
          E2E_SESSION_TYPE: unset
        run: bash .github/denext-runtime/e2e/e2e.sh

      # The reports, the launch logs and each app's own results file
      # (w/e2e-results: what it recorded with r.set / r.mark, such as the
      # dnd area's dialogWindowAfterMs), to tell a slow runner from a bug.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: e2e-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/e2e-out/
            ${{ runner.temp }}/e2e-webview/w/logs/
            ${{ runner.temp }}/e2e-webview/w/e2e-results/
            ${{ runner.temp }}/e2e-cef/w/logs/
            ${{ runner.temp }}/e2e-cef/w/e2e-results/
            ${{ runner.temp }}/e2e-out-keyring/
            ${{ runner.temp }}/e2e-keyring/w/logs/
            ${{ runner.temp }}/e2e-keyring/w/e2e-results/
            ${{ runner.temp }}/e2e-out-keyring-kwallet/
            ${{ runner.temp }}/e2e-keyring-kwallet/w/logs/
            ${{ runner.temp }}/e2e-keyring-kwallet/w/e2e-results/
            ${{ runner.temp }}/e2e-out-keyring-persist/
            ${{ runner.temp }}/e2e-keyring-persist/w/logs/
            ${{ runner.temp }}/e2e-keyring-persist/w/e2e-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### $TARGET"
            echo "- package webview: ok, package cef: ok"
            echo "- launch webview: ${{ steps.launch_webview.outcome }}"
            echo "- launch cef: ${{ steps.launch_cef.outcome }}"
            echo "- e2e webview: ${{ steps.e2e_webview.outcome }}"
            echo "- e2e cef: ${{ steps.e2e_cef.outcome }}"
            echo '```'
            cat dist/*.sha256
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.target }}
          path: dist/
          retention-days: 30

  publish:
    name: publish
    needs: [setup, package, cli]
    # A `cli_only` dry run has no package job: it still writes (and uploads)
    # the manifest, from the CLI archives alone.
    if: ${{ always() && needs.cli.result == 'success' && (needs.package.result == 'success' || (inputs.cli_only && needs.package.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/denext-runtime
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !inputs.cli_only }}
        with:
          pattern: runtime-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      # The debug info (collect_symbols.sh), released beside the archives but
      # not in manifest.json: denext never downloads it.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          pattern: symbols-*
          path: symbols
          merge-multiple: true

      - name: SHA256SUMS + manifest.json
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/denext-runtime-v') && github.ref_name || '' }}
          REPOSITORY: ${{ github.repository }}
          # The upstream Deno release the fork is built from (BUILD_INFO.json's
          # and manifest.json's deno.version; denext's pins read it as `deno`).
          DENO_VERSION: ${{ needs.setup.outputs.upstream_version }}
          DENO_SHA: ${{ github.sha }}
          LAUFEY_SHA: ${{ needs.setup.outputs.laufey_sha }}
          CEF_VERSION: ${{ needs.setup.outputs.cef_version }}
          LAUFEY_API_VERSION: ${{ needs.setup.outputs.laufey_api }}
          CLI_ONLY: ${{ inputs.cli_only && '1' || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rm -f dist/*.sha256
          python3 .github/denext-runtime/manifest.py dist
          cat dist/SHA256SUMS
          (cd dist && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manifest
          path: |
            dist/SHA256SUMS
            dist/manifest.json

      # Only a tag PUSH publishes: a manual dispatch run on a tag ref (with a
      # `targets` filter or reused artifacts) must never become a release.
      - name: Check every target is present (tag)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/denext-runtime-v')
        run: |
          n=$(python3 -c 'import json;m=json.load(open("dist/manifest.json"));print(sum(len([k for k in v if k!="runtimeLib"]) for v in m["targets"].values()))')
          echo "archives: $n"
          test "$n" = 12 ||
            { echo "::error::manifest.json lists $n desktop runtime archives, want 12 (6 targets x webview + cef)"; exit 1; }
          c=$(python3 -c 'import json;m=json.load(open("dist/manifest.json"));print(len(m["cli"]["targets"]))')
          echo "cli archives: $c"
          test "$c" = 6 ||
            { echo "::error::manifest.json lists $c CLI archives, want 6 (one per target)"; exit 1; }
          r=$(python3 -c 'import json;m=json.load(open("dist/manifest.json"));print(len(m["denort"]["targets"]))')
          echo "denort archives: $r"
          test "$r" = 6 ||
            { echo "::error::manifest.json lists $r denort archives, want 6 (one per target)"; exit 1; }

      - name: GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/denext-runtime-v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          FULL_RUN: ${{ needs.setup.outputs.full_run }}
          # Every expression goes through the environment: values expand as
          # data inside the heredoc, never as shell source.
          # The upstream Deno release the fork is built from (BUILD_INFO.json's
          # and manifest.json's deno.version; denext's pins read it as `deno`).
          DENO_VERSION: ${{ needs.setup.outputs.upstream_version }}
          LAUFEY_SHA: ${{ needs.setup.outputs.laufey_sha }}
          CEF_VERSION: ${{ needs.setup.outputs.cef_version }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version=${TAG#denext-runtime-v}
          # Immutable (P8): the tag is still the annotated tag of this commit
          # the setup job checked hours ago, and the release is created on it
          # (--verify-tag: never a tag of its own) or not at all.
          tag_obj=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "${tag_obj%% *}" != tag ]; then
            echo "::error::$TAG is no longer an annotated tag ($tag_obj)"; exit 1
          fi
          tag_commit=$(gh api "repos/$REPO/git/tags/${tag_obj#* }" --jq '.object.sha')
          if [ "$tag_commit" != "$SHA" ]; then
            echo "::error::$TAG moved to $tag_commit while $SHA was being built: not publishing"; exit 1
          fi
          # GitHub "Latest" goes to the newest version in the fork's order
          # (tag_gate.py version_key: 3.0.0-rc.N < 3.0.0-denext.N), never to a
          # pre-release or an older line's patch release, set explicitly every
          # time.
          others=$(gh release list --repo "$REPO" --limit 500 --json tagName --jq '.[].tagName' |
            sed -n 's/^denext-runtime-v//p')
          # shellcheck disable=SC2086 # one version per word
          latest=$(python3 -I .github/denext-runtime/tag_gate.py --latest "$version" $others)
          echo "latest: $latest"
          # Every target's symbol archives, none empty (DENEXT.md item 181:
          # denext.2 and .3 shipped macOS archives of dangling symlinks).
          compgen -G 'symbols/*.tar.gz' >/dev/null ||
            { echo "::error::no debug symbols to attach"; exit 1; }
          (cd symbols && cat ./*.sha256 >SYMBOLS.SHA256SUMS && sha256sum -c SYMBOLS.SHA256SUMS && rm -f ./*.tar.gz.sha256)
          python3 -I .github/denext-runtime/symbolicate.py check-release "$version" --dir symbols ||
            { echo "::error::the release's symbol archives are incomplete (see above)"; exit 1; }
          symbols=(symbols/*.tar.gz symbols/SYMBOLS.SHA256SUMS)
          cat >notes.md <<EOF
          denext's Deno fork ${TAG#denext-runtime-v}: the patched Deno Desktop runtime and CLI, built from upstream Deno ${DENO_VERSION} plus denext's patches ([DENEXT.md](https://github.com/${REPO}/blob/${SHA}/DENEXT.md), "Versioning").

          - deno: \`${SHA}\`
          - laufey: [\`${LAUFEY_SHA}\`](https://github.com/Brainwires/laufey/commit/${LAUFEY_SHA})
          - CEF: ${CEF_VERSION}

          Use with the stock \`deno desktop\` ${STOCK_DENO_VERSION}: unpack an archive, then set
          \`DENORT_DESKTOP_BIN=<dir>/<runtime lib>\` and \`LAUFEY_DEV_DIR=<dir>/laufey\`.
          \`manifest.json\` lists every archive with its URL, SHA-256 and size; each archive has a
          build provenance attestation (\`gh attestation verify <file> -R ${REPO}\`).

          \`deno-cli-*\` is this fork's own \`deno\` CLI (Vitest compatibility in \`deno test\`,
          \`Deno.SQL\`, ...): unpack it and run \`deno\` (\`deno.exe\` on Windows). Beside it is
          the official esbuild ${ESBUILD_VERSION} (\`esbuild.LICENSE\`), which \`deno bundle\` uses
          instead of downloading one, and in \`typescript-check/\` the official native TypeScript 7.0 compiler
          (Apache-2.0), which \`deno check\` and the other type-checking commands run
          (\`--check-engine=tsc\` keeps the in-process TypeScript 6.0.3), and in \`tsgolint/\` the
          official tsgolint (MIT), which \`deno lint --type-aware\` runs. The CLI's
          \`deno --version\` and \`Deno.version.deno\` name this release (\`${TAG#denext-runtime-v}\`).
          They are listed under \`cli\` in \`manifest.json\`.

          \`deno-denort-*\` is the standalone runtime that CLI's \`deno compile\` builds onto (a zip
          holding \`denort\` / \`denort.exe\`), so a compiled app carries the same patches and
          \`Deno.SQL\`; the CLI downloads it from this release by itself. Listed under \`denort\`.

          \`*-symbols-*.tar.gz\` hold the release binaries' debug info (\`.dSYM\` / \`.dwp\` / \`.pdb\`)
          for symbolicating a crash report (\`SYMBOLS.SHA256SUMS\`); they are not in \`manifest.json\`.

          Tag gate: full \`denext tests\` run [${FULL_RUN}](https://github.com/${REPO}/actions/runs/${FULL_RUN}).
          EOF
          # A release candidate (3.0.0-rc.N) is marked a pre-release, so it
          # never becomes the repository's "Latest" release; the fork's
          # 3.0.0-denext.N line is its stable line, released in full
          # (tag_gate.py is_prerelease).
          prerelease=$(python3 -I .github/denext-runtime/tag_gate.py --prerelease-flag "${TAG#denext-runtime-v}")
          gh release create "$TAG" --repo "$REPO" --title "$TAG" \
            --notes-file notes.md --verify-tag --latest="$latest" $prerelease \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS dist/manifest.json "${symbols[@]}"
