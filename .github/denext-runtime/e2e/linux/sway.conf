# The compositor of E2E_DISPLAY=wayland (linux/session.sh). The same screen size
# as the Xvfb session. Every window floats: tiling would hand each window the
# whole output and answer every size it asks for with that, which would say
# nothing about the app. No X server, so nothing can fall back to XWayland.
xwayland disable
output HEADLESS-1 resolution 1600x1000
for_window [title=".*"] floating enable
default_floating_border none
focus_on_window_activation focus
