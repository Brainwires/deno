[package]
name = "deno_sandbox"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "OS confinement for Deno: Landlock and seccomp on Linux, Seatbelt on macOS, and an allow-listing proxy"

[lib]
path = "lib.rs"

[features]
# the allow-listing HTTP proxy (an HTTP stack of its own) and the broker's
# network authority: a binary that only confines itself carries neither
proxy = ["dep:base64", "dep:futures", "dep:percent-encoding", "dep:socket2", "dep:url"]

[dependencies]
base64 = { workspace = true, optional = true }
deno_net_route.workspace = true
futures = { workspace = true, optional = true }
log.workspace = true
percent-encoding = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
socket2 = { workspace = true, optional = true }
tokio.workspace = true
url = { workspace = true, optional = true }

[dev-dependencies]
deno_permissions.workspace = true
tempfile.workspace = true

[[test]]
name = "broker_linux"
path = "tests/broker_linux.rs"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
rand.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
